<style>
/* Layout: sticky instrument-style header with tabs; single working column (max 1100px); chart panel with SD-unit axis and value labels on the right. */
:root{
  --bg:#EDF1F2; --surface:#FFFFFF; --surface2:#F5F8F9; --ink:#15222B; --muted:#55666F; --line:#D3DBDF;
  --accent:#0B7A6F; --accent-ink:#FFFFFF; --accent-soft:#DDF0EA; --logo-bg:transparent;
  --good:#2A7A4B; --warn:#A35F00; --bad:#BF3A2D; --bad-soft:#FBE7E4; --warn-soft:#FBEFD9; --good-soft:#E1F1E7;
  --grid:#E1E7EA; --zone1:#F2F6F7; --zone2:#FBF3DF; --zone3:#FBE6E3;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --cond:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E161B; --surface:#16212A; --surface2:#1B2832; --ink:#E5ECEF; --muted:#9AABB4; --line:#2B3A44;
  --accent:#4FC1CC; --accent-ink:#04262A; --accent-soft:#17383D; --logo-bg:#EEF3F5;
  --good:#5CC48A; --warn:#E5A445; --bad:#F27766; --bad-soft:#3A1F1C; --warn-soft:#37290F; --good-soft:#15301F;
  --grid:#25333D; --zone1:#182630; --zone2:#2A2713; --zone3:#33201E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E161B; --surface:#16212A; --surface2:#1B2832; --ink:#E5ECEF; --muted:#9AABB4; --line:#2B3A44;
  --accent:#4FC1CC; --accent-ink:#04262A; --accent-soft:#17383D; --logo-bg:#EEF3F5;
  --good:#5CC48A; --warn:#E5A445; --bad:#F27766; --bad-soft:#3A1F1C; --warn-soft:#37290F; --good-soft:#15301F;
  --grid:#25333D; --zone1:#182630; --zone2:#2A2713; --zone3:#33201E; color-scheme:dark}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--cond);font-weight:600;margin:0;letter-spacing:.01em;text-wrap:balance}
h2{font-size:22px} h3{font-size:16px}
.wrap{max-width:1100px;margin:0 auto;padding-block:16px 48px}
header.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding-block:14px 10px}
.brand{display:flex;flex-direction:row;align-items:center;gap:14px;min-width:0}
.logo{display:block;height:88px;width:auto;max-width:100%;background:var(--logo-bg);border-radius:10px;padding:2px 8px}
.brand span{color:var(--muted);font-size:13px;min-width:0}
.auth{min-height:75vh;display:flex;align-items:center;justify-content:center;padding-block:28px}
.authcard{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;display:flex;flex-direction:column;gap:18px}
.authcard .logo.big{height:auto;width:min(250px,100%);margin:0 auto;padding:6px 12px}
.authcard form .btn{width:100%}
.amsg{margin:0;padding:8px 10px;border-radius:6px;background:var(--bad-soft);color:var(--bad);font-size:13px;border:1px solid var(--bad)}
.reccode{font:600 22px var(--mono);letter-spacing:.08em;text-align:center;padding:16px 8px;border:1px dashed var(--accent);border-radius:8px;background:var(--accent-soft);user-select:all;word-break:break-all}
.userbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.userbar .who{display:flex;align-items:center;gap:8px;margin-right:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:18px}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:500 14px var(--sans);padding:10px 14px;cursor:pointer;display:flex;gap:6px;align-items:center}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{background:var(--bad);color:#fff;border-radius:99px;font:600 11px var(--mono);padding:1px 7px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 13px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.green{background:#B0DD60;color:#15222B;border-color:#8FC23F;font-weight:600}
.btn.green:hover{background:#A2D24E}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
input[type=number]{font-family:var(--mono)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.row>*{min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.muted{color:var(--muted)} .mono{font-family:var(--mono)} .small{font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:500;border:1px solid var(--line);background:var(--surface2)}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.chip.good{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.steps span{font:500 12.5px var(--sans);padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.steps span.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.steps span.done{color:var(--ink)}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{font:600 11.5px var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:6px 8px;border-bottom:1px solid var(--grid);vertical-align:middle}
.scroll{overflow-x:auto}
.panelcard{border:1px solid var(--line);border-radius:8px;background:var(--surface2);padding:12px}
.panelcard h3{display:flex;justify-content:space-between;gap:8px;align-items:center}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px}
.checks.col{flex-direction:column;flex-wrap:nowrap;gap:6px}
.arow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.arow label{min-width:0}
input.unitin[type=text]{width:92px;padding:3px 7px;font:12px var(--mono);flex:none}
.checks label{display:flex;gap:6px;align-items:center;cursor:pointer}
.due{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;padding:12px;border-bottom:1px solid var(--grid)}
.due:last-child{border-bottom:0}
.due .nm{font-weight:600;flex:1 1 170px;min-width:0}
.due label.f{flex:1 1 120px;max-width:200px}
.due .btn{flex:none}
.due.skipped{opacity:.8;background:var(--surface2)}
.alert{border:1px solid var(--bad);background:var(--bad-soft);border-radius:8px;padding:12px 14px}
.alert.warn{border-color:var(--warn);background:var(--warn-soft)}
.alert ul{margin:6px 0 0 18px;padding:0}
.alert li{margin:2px 0}
.chartbox{position:relative}
svg.lj{width:100%;height:auto;display:block;overflow:visible}
svg.lj text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
svg.lj .ax{stroke:var(--grid);stroke-width:1}
svg.lj .mean{stroke:var(--accent);stroke-width:1.6}
svg.lj .s1{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 4;opacity:.8}
svg.lj .s2{stroke:var(--warn);stroke-width:1.2;stroke-dasharray:6 4}
svg.lj .s3{stroke:var(--bad);stroke-width:1.4}
svg.lj .line{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.55}

.sp-t,.sp-s{pointer-events:none}
svg.lj .sp-t{fill:var(--warn);opacity:.16;stroke:var(--warn);stroke-dasharray:4 3;stroke-width:1}
svg.lj .sp-s{fill:var(--bad);opacity:.1;stroke:var(--bad);stroke-dasharray:4 3;stroke-width:1}
svg.lj .spl{font-size:11px;font-weight:600}svg.lj .spl-t{fill:var(--warn)}svg.lj .spl-s{fill:var(--bad)}
.panelcard.locked{opacity:.62;background:var(--surface2)}
.arow.lk label{color:var(--muted)}
.angrp{margin-bottom:14px}
.angh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700;font-size:15px;padding:8px 2px;margin:4px 0 6px;border-bottom:2px solid var(--accent)}
svg.lj .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
svg.lj .pt.w{fill:var(--warn)} svg.lj .pt.r{fill:var(--bad)}
svg.lj .pt.ex{fill:var(--muted);opacity:.45}
svg.lj .pt.ov{fill:var(--surface);stroke:var(--bad);stroke-width:2.5}
svg.lj .ring{fill:none;stroke:var(--bad);stroke-width:2}
svg.lj .lotline{stroke:var(--accent);stroke-width:1.2;stroke-dasharray:3 3}
svg.lj text.lab{fill:var(--ink);font-weight:500}
svg.lj text.l3{fill:var(--bad)} svg.lj text.l2{fill:var(--warn)} svg.lj text.lm{fill:var(--accent);font-weight:500}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:6px;padding:6px 9px;font-size:12px;z-index:5;max-width:240px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:50;max-width:90vw}
.modalbg{position:fixed;inset:0;background:rgba(10,18,22,.55);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto;z-index:40}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;max-width:620px;width:100%}
.hint{background:var(--accent-soft);border-radius:6px;padding:8px 11px;font-size:12.5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days label{border:1px solid var(--line);border-radius:6px;padding:3px 8px;cursor:pointer;font-size:12.5px;background:var(--surface)}
.days input{position:absolute;opacity:0;pointer-events:none}
.days label:has(input:checked){background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.days label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.empty{padding:28px;text-align:center;color:var(--muted)}

@media (max-width:640px){
  body{font-size:15px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .wrap{padding-block:8px 32px}
  header.top{gap:8px 12px;padding-block:8px 6px}
  .logo{height:52px}
  .brand{gap:10px;width:100%}
  .brand span{font-size:12.5px}
  .userbar{width:100%;justify-content:space-between}
  .userbar .who{flex:1 1 100%;margin:0}
  nav.tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-inline:-12px;padding-inline:12px;margin-bottom:12px}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{white-space:nowrap;padding:12px 12px;flex:none}
  .btn{min-height:42px;padding:9px 14px}
  .btn.sm{min-height:36px;padding:6px 11px}
  input[type=text],input[type=password],input[type=number],input[type=date],input[type=email],select,textarea{font-size:16px;min-height:42px}
  input[type=checkbox]{width:20px;height:20px}
  .panel{padding:12px;border-radius:8px}
  h2{font-size:20px}
  .grid2{grid-template-columns:1fr}
  .row{gap:10px}
  .due{padding:10px 8px;gap:8px 10px}
  .due .nm{flex:1 1 100%}
  .due label.f{flex:1 1 calc(50% - 10px);max-width:none}
  .due .btn{flex:1 1 100%}
  .auth{min-height:auto;padding-block:12px;align-items:flex-start}
  .authcard{padding:18px;gap:14px}
  .modalbg{padding:0;align-items:flex-end}
  .modal{max-width:none;max-height:92vh;overflow-y:auto;border-radius:14px 14px 0 0;padding:16px}
  .modal .row{justify-content:stretch}
  .modal .row .btn{flex:1 1 auto}
  table.t td,table.t th{padding:8px 6px}
  .toast{left:12px;right:12px;max-width:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== Engine: dates, targets, Westgard rules ===== */
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr=()=>dstr(new Date());
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const dowOf=s=>pd(s).getDay();
const daysBetween=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const fmtDate=s=>{const d=pd(s);return DOW[d.getDay()]+' '+pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()};
const shortDate=s=>pad(pd(s).getDate())+'/'+pad(pd(s).getMonth()+1);

function isDue(a,date){
  const s=a.schedule||{type:'daily'};
  if(s.type==='daily')return true;
  if(s.type==='weekdays')return (s.days||[]).includes(dowOf(date));
  if(s.type==='ondemand')return false;
  if(s.type==='interval'){const n=Math.max(1,+s.every||1);const k=daysBetween(s.start||date,date);return k>=0&&k%n===0}
  return true;
}
function scheduleText(a){
  const s=a.schedule||{type:'daily'};
  if(s.type==='daily')return 'Every day';
  if(s.type==='ondemand')return 'On demand (no fixed schedule)';
  if(s.type==='weekdays')return (s.days||[]).length?(s.days||[]).slice().sort().map(d=>DOW[d]).join(', '):'No days chosen';
  return 'Every '+s.every+' days from '+fmtDate(s.start);
}
function targetIndex(a,date){
  let idx=0;
  a.targets.forEach((t,i)=>{if(t.from<=date)idx=i});
  return idx;
}
const targetFor=(a,date)=>a.targets[targetIndex(a,date)];
const curTarget=a=>a.targets[a.targets.length-1];
const zOf=(a,r)=>{const t=targetFor(a,r.date).levels[r.lv];return t&&t.sd>0?(r.value-t.mean)/t.sd:0};

const RULES={
 '1-2s':{sev:'warn',name:'1₂ₛ warning',desc:'One control is more than 2 SD from the mean.',
   fix:['Warning only. Accept the run if no other rule is broken.','Look at the chart for a trend or shift building up.','Check the other control level in the same run.','Watch the next run closely.']},
 '1-3s':{sev:'reject',name:'1₃ₛ',desc:'One control is more than 3 SD from the mean (random error, or a large systematic error).',
   fix:['Re-run the same control with a fresh aliquot or vial.','Check the sample probe, bubbles, clots and short sampling.','Confirm the control was thawed, mixed and labelled correctly and is within expiry.','Check reagent volume, reagent expiry and on-board stability.','If it repeats, calibrate and re-run both levels before reporting patient results.']},
 '2-2s':{sev:'reject',name:'2₂ₛ',desc:'Two consecutive controls are more than 2 SD on the same side of the mean (systematic error).',
   fix:['Calibrate the analyte, then re-run both control levels.','Open a fresh reagent pack or a new reagent lot and check storage temperature.','Open a new control vial in case the current one has deteriorated.','Check recent maintenance, lamp, ISE electrodes, probe and water quality.','Hold patient results until QC is back within limits.']},
 'R-4s':{sev:'reject',name:'R₄ₛ',desc:'Two controls in one run are more than 4 SD apart: one above +2 SD and one below −2 SD (random error).',
   fix:['Re-run both levels with fresh aliquots.','Check pipetting, mixing, bubbles and sample probe condition.','Check for electrical noise, unstable temperature and cuvette or electrode problems.','Review the reagent and control handling steps.','Repeat QC. Persistent R₄ₛ needs service or maintenance.']},
 '4-1s':{sev:'reject',name:'4₁ₛ',desc:'Four consecutive controls are more than 1 SD on the same side of the mean (small systematic shift).',
   fix:['Calibrate and re-run QC.','Check whether a reagent or calibrator lot changed recently.','Compare against another analyser or a peer group if available.','Check scheduled maintenance, lamp hours and reagent deterioration.','If the shift is real after a lot change, review the target mean (Lot change button).']},
 '10x':{sev:'reject',name:'10ₓ',desc:'Ten consecutive controls fall on the same side of the mean (persistent bias).',
   fix:['Look for a gradual drift: reagent, calibrator, control or lamp ageing.','Calibrate and re-run QC.','Check whether the target mean still matches the current lot.','Review maintenance and environmental changes (temperature, water).','Document the investigation, then override with a comment if the run is judged acceptable.']},
 'T7':{sev:'warn',name:'Trend (7T)',desc:'Seven or more consecutive controls of one level move steadily in the same direction (gradual drift).',
   fix:['Check the reagent: deteriorating, near its on-board stability limit or stored warm. Replace with a fresh pack.','Check the control and calibrator material: evaporation, long-open vial, or storage temperature.','Check lamp hours, electrode or probe wear, cuvette condition and reagent compartment temperature.','Review water quality and recent maintenance.','Calibrate and re-run QC. If the drift continues, open a new reagent or control lot and compare.','Look at the patient moving average for the same drift.']},
 'S6':{sev:'warn',name:'Shift (6x)',desc:'Six or more consecutive controls of one level fall on the same side of the mean (early sign of a shift).',
   fix:['Ask what changed when the shift began: new reagent lot or pack, calibration, control vial or lot, maintenance, lamp or electrode change.','Check that calibration used the correct calibrator lot and passed its acceptance checks.','Recalibrate and re-run QC; compare with another analyser or peer group.','If a new control lot started the shift, record it with Lot change and a comment so the target is updated.','Check the patient moving average before the shift becomes a rejection (4₁ₛ or 10ₓ).']}
};
/* trends and shifts per control level: runs of points that drift or sit on one side of the mean */
const RORDER=['1-2s','1-3s','2-2s','R-4s','4-1s','10x','T7','S6'];
const ruleOn=k=>{try{return !S.rules||S.rules[k]!==false}catch(e){return true}};
function patternsFor(a,lv,results){
  const rs=results.filter(r=>r.aid===a.id&&r.lv===lv).sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:0),segs={};
  rs.forEach(r=>{const k=targetIndex(a,r.date);(segs[k]||(segs[k]=[])).push({r,z:zOf(a,r)})});
  const out=[],push=(kind,dir,w,seg)=>out.push({kind,dir,lv,ids:w.map(p=>p.r.id),n:w.length,from:w[0].r.date,to:w[w.length-1].r.date,open:w[w.length-1]===seg[seg.length-1]});
  Object.values(segs).forEach(seg=>{
    let i=0;while(i<seg.length){ // shift: same side of the mean
      const s=Math.sign(seg[i].z);if(!s){i++;continue}
      let j=i;while(j+1<seg.length&&Math.sign(seg[j+1].z)===s)j++;
      if(j-i+1>=6)push('shift',s,seg.slice(i,j+1),seg);i=j+1}
    i=0;while(i<seg.length-1){ // trend: steadily rising or falling
      const d=Math.sign(seg[i+1].z-seg[i].z);if(!d){i++;continue}
      let j=i+1;while(j+1<seg.length&&Math.sign(seg[j+1].z-seg[j].z)===d)j++;
      if(j-i+1>=7)push('trend',d,seg.slice(i,j+1),seg);i=d?j:j+1}
  });
  return out.filter(p=>ruleOn(p.kind==='shift'?'S6':'T7'));
}
function evaluate(a,results){
  const out={}; // resultId -> [{rule,sev}]
  const add=(r,rule)=>{if(!ruleOn(rule))return;const o=out[r.id]||(out[r.id]=[]);if(!o.some(x=>x.rule===rule))o.push({rule,sev:RULES[rule].sev})};
  const rs=results.filter(r=>r.aid===a.id).sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:x.lv-y.lv);
  const segs={};
  rs.forEach(r=>{const k=targetIndex(a,r.date);(segs[k]||(segs[k]=[])).push({r,z:zOf(a,r)})});
  Object.values(segs).forEach(seg=>{
    seg.forEach(p=>{const m=Math.abs(p.z);if(m>3)add(p.r,'1-3s');else if(m>2)add(p.r,'1-2s')});
    const byLv={};seg.forEach(p=>(byLv[p.r.lv]||(byLv[p.r.lv]=[])).push(p));
    const byDate={};seg.forEach(p=>(byDate[p.r.date]||(byDate[p.r.date]=[])).push(p));
    const runs=(arr,n,test,rule)=>{for(let i=n-1;i<arr.length;i++){const w=arr.slice(i-n+1,i+1);if(w.every(p=>test(p.z,w[0].z)))add(arr[i].r,rule)}};
    Object.values(byLv).forEach(arr=>{
      runs(arr,2,(z,z0)=>Math.abs(z)>2&&Math.sign(z)===Math.sign(z0),'2-2s');
      runs(arr,4,(z,z0)=>Math.abs(z)>1&&Math.sign(z)===Math.sign(z0),'4-1s');
      runs(arr,10,(z,z0)=>z!==0&&Math.sign(z)===Math.sign(z0),'10x');
    });
    // across levels, chronological stream of all levels
    if(Object.keys(byLv).length>1){
      runs(seg,4,(z,z0)=>Math.abs(z)>1&&Math.sign(z)===Math.sign(z0),'4-1s');
      runs(seg,10,(z,z0)=>z!==0&&Math.sign(z)===Math.sign(z0),'10x');
    }
    Object.values(byDate).forEach(g=>{
      for(let i=0;i<g.length;i++)for(let j=i+1;j<g.length;j++){
        const a1=g[i].z,b1=g[j].z;
        if(Math.abs(a1)>2&&Math.abs(b1)>2&&Math.sign(a1)===Math.sign(b1)){add(g[i].r,'2-2s');add(g[j].r,'2-2s')}
        if((a1>2&&b1<-2)||(a1<-2&&b1>2)){add(g[i].r,'R-4s');add(g[j].r,'R-4s')}
      }
    });
  });
  const byId={};results.forEach(r=>{if(r.aid===a.id)byId[r.id]=r});
  for(let lv=0;lv<(a.nlev||1);lv++)patternsFor(a,lv,results).forEach(sp=>{
    if(sp.kind==='trend')sp.ids.slice(6).forEach(id=>add(byId[id],'T7'));
    else sp.ids.slice(5).forEach(id=>add(byId[id],'S6'))});

function registerSrc(panel,name,unit){
  const st=S.setup;syncSel();
  const cp=st.cpanels.find(c=>c.name===panel),rp=panelsNow().find(p=>p.name===panel);
  if(cp){cp.items.push({name,unit,on:true});return name}
  if(rp){
    const base=rp.items.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(base){name=base.name;if(unit!==base.unit)st.units[base.name]=unit;else delete st.units[base.name]}

}

function saveAdd(){
  const m=UI.modal,d=readAdd(),err=document.getElementById('a-err'),n=m.n;
  const fail=t=>{err.textContent=t;err.hidden=false;return true};
  if(d.mode==='move'){
    if(!d.mv.length)return fail('Tick at least one analyte to move.');
    d.mv.forEach(id=>moveAnalyte(id,m.panel));
    audit('Analytes moved',d.mv.map(id=>(anOf(id)||{}).name).join(', ')+' to '+m.panel);
  UI.modal=null;save();toast(d.mv.length+' analyte'+(d.mv.length>1?'s':'')+' moved to '+m.panel+'.');return;
  }
  let name=d.name.trim();
  if(!name)return fail('Enter the analyte name.');
  if(DA().some(a=>a.name.toLowerCase()===name.toLowerCase()))return fail(name+' already exists. To run it on another analyser use "Copy selected" under Assign analytes to analysers.');
  const levels=[];
  for(let i=0;i<n;i++){
    const mean=num(d.means[i]),sd=num(d.sds[i]),mat=d.mats[i].trim();
    if(!mat)return fail('Every level needs a QC material name ('+levelName(i)+').');
    if(!d.exps[i])return fail('Every level needs an expiry date ('+levelName(i)+').');
    if(mean==null||!(sd>0))return fail('Every level needs a mean and an SD above zero.');
    levels.push({mean,sd,material:mat,lot:d.lots[i].trim(),exp:d.exps[i]});
  }
  const first=DA().find(x=>x.panel===m.panel);let schedule={type:'daily'};
  if(d.sched==='panel'&&first)schedule=JSON.parse(JSON.stringify(first.schedule));
  else if(d.sched==='ondemand')schedule={type:'ondemand'};
  else if(d.sched==='weekdays'){if(!d.days.length)return fail('Choose at least one day.');schedule={type:'weekdays',days:d.days}}
  else if(d.sched==='interval')schedule={type:'interval',every:Math.max(2,+d.every||2),start:d.start||todayStr()};
  const unit=d.unit.trim(),ai=d.inst?splitInst(d.inst):{inst:first?instOf(first):(S.setup.analysers||[])[0]||'',mod:first?(first.mod||''):''};
  name=registerSrc(m.panel,name,unit);
  S.analytes.push({id:uid(),dept:curId(),name,unit,panel:m.panel,inst:ai.inst,mod:ai.mod,nlev:n,schedule,targets:[{from:todayStr(),comment:'Added after setup',levels}]});
  audit('Analyte added',name+' to '+m.panel+' ('+n+' level'+(n>1?'s':'')+')');
  UI.modal=null;save();toast(name+' added to '+m.panel+'.');
}

function asgMove(copy){
  const st=S.setup,ids=Object.keys(UI.asg).filter(id=>DA().some(a=>a.id===id)),err=document.getElementById('as-err');
  const fail=t=>{if(err){err.textContent=t;err.hidden=false}return true};

  let inst,mod='',fresh=false;
  if(UI.asgT==='__new'){
    let base=UI.asgNew==='Other'?(UI.asgName||'').trim():UI.asgNew;if(!base)return fail('Choose the new analyser'+(UI.asgNew==='Other'?' and give it a name.':'.'));
    let nm=base,k=2;while((st.analysers||[]).some(x=>x.toLowerCase()===nm.toLowerCase()))nm=base+' ('+(k++)+')';
    st.analysers.push(nm);st.amods=st.amods||{};st.amods[nm]=(AMODS[baseName(base)]||[]).slice();inst=nm;fresh=true;
  }else if(UI.asgT){const v=splitInst(UI.asgT);inst=v.inst;mod=v.mod}else return fail('Choose where to move them.');
  const names=[],skipped=[];
  if(copy){
    ids.forEach(id=>{const a=anOf(id);if(!a)return;const m=fresh?(UI.asgMod||defMod(a.name,inst)):mod;
      if(DA().some(x=>x.name===a.name&&x.inst===inst&&(x.mod||'')===(m||''))){skipped.push(a.name);return}
      const t=curTarget(a);
      S.analytes.push({id:uid(),dept:a.dept,name:a.name,unit:a.unit,panel:a.panel,inst,mod:m,nlev:a.nlev,schedule:JSON.parse(JSON.stringify(a.schedule||{type:'daily'})),copyOf:a.copyOf||a.id,

  }
  ids.forEach(id=>{const a=anOf(id);if(!a)return;a.inst=inst;a.mod=fresh?(UI.asgMod||defMod(a.name,inst)):mod;names.push(a.name)});

  UI.asg={};UI.asgT='';UI.asgNew='';UI.asgName='';UI.asgMod='';save();render();toast(names.length+' analyte'+(names.length===1?'':'s')+' moved to '+inst+'.');return true;
}

/* hashing */
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function hashPw(pw,saltB64){
  const salt=saltB64?unb64(saltB64):crypto.getRandomValues(new Uint8Array(16));
  const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:150000},key,256);
  return {salt:b64(salt),hash:b64(bits)};
}
const checkPw=async(pw,rec)=>rec&&(await hashPw(pw,rec.salt)).hash===rec.hash;
function genCode(){
  const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(12));
  const c=[...r].map(x=>A[x%A.length]).join('');return c.slice(0,4)+'-'+c.slice(4,8)+'-'+c.slice(8);
}
function genPw(){
  const A='abcdefghijkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(10));
  return [...r].map(x=>A[x%A.length]).join('');
}

async function doAdmin(){
  const name=gv('ca-name').trim(),un=gv('ca-user').trim().toLowerCase(),p=gv('ca-pass'),p2=gv('ca-pass2');
  UI.authUser=un;UI.authName=name;
  if(!name)return UI.authMsg='Enter your full name.';
  if(!/^[a-z0-9._-]{3,}$/.test(un))return UI.authMsg='Username: at least 3 letters, numbers, dots, dashes or underscores.';
  const pr=pwProblem(p,p2);if(pr)return UI.authMsg=pr;
  const code=genCode(),u={id:uid(),username:un,name,role:'admin',active:true,mustChange:false,created:nowIso(),pw:await hashPw(p),rec:await hashPw(code.replace(/-/g,''))};
  S.users.push(u);signIn(u);audit('Account created','Administrator account created',u);audit('Sign in','',u);save();UI.recCode=code;
}
async function doSvcLogin(un,pw){
  const bad='Username or password is incorrect.';
  let salt;try{salt=(await svcCall('/salt',{u:un},false)).salt}catch(e){return UI.authMsg=e.message}
  const hash=(await hashPw(pw,salt)).hash;setCred({u:un,hash,salt});
  let j;try{j=await svcCall('/pull')}catch(e){setCred(null);return UI.authMsg=e.code===401?bad:e.message}
  if(j.empty||!j.data){setCred(null);return UI.authMsg='This laboratory has no data on the sync service yet. The administrator needs to connect it first.'}
  S=norm(mergeStates(S,norm(j.data)));S.tab='today';
  const u=S.users.find(x=>x.id===j.me);if(!u){setCred(null);return UI.authMsg=bad}
  GHS.sha=j.sha;GHS.lastHash=null;GHS.boot=false;
  signIn(u);audit('Sign in','',u);save();
}
async function doLogin(){
  const un=gv('li-user').trim().toLowerCase(),pw=gv('li-pass');UI.authUser=un;
  if(svcOn())return doSvcLogin(un,pw);
  const u=S.users.find(x=>x.username===un||String(x.email||'').toLowerCase()===un),bad='Username or password is incorrect.';
  if(!u||u.active===false){audit('Failed sign-in','Unknown or disabled username "'+un+'"',{id:null,name:un});save();return UI.authMsg=bad}
  if(u.lockUntil&&Date.now()<u.lockUntil)return UI.authMsg='Too many attempts. Wait a minute and try again.';
  if(!await checkPw(pw,u.pw)){u.fails=(u.fails||0)+1;if(u.fails>=5){u.lockUntil=Date.now()+60000;u.fails=0}audit('Failed sign-in','Wrong password',u);save();return UI.authMsg=bad}
  u.fails=0;u.lockUntil=0;signIn(u);audit('Sign in','',u);save();
}
async function doForgot(){
  if(svcOn())return UI.authMsg='Password resets are done by an administrator. Ask them to set a temporary password for you.';
  const un=gv('fg-user').trim().toLowerCase(),code=gv('fg-code').toUpperCase().replace(/[^A-Z0-9]/g,''),p=gv('fg-pass'),p2=gv('fg-pass2');UI.authUser=un;UI.authCode=gv('fg-code');
  const pr=pwProblem(p,p2);if(pr)return UI.authMsg=pr;
  const u=S.users.find(x=>x.username===un&&x.role==='admin'&&x.rec&&x.active!==false);
  if(!u||!await checkPw(code,u.rec)){audit('Failed password reset','Wrong username or recovery code "'+un+'"',{id:null,name:un});save();return UI.authMsg='The username and recovery code do not match.'}
  const nc=genCode();u.pw=await hashPw(p);u.rec=await hashPw(nc.replace(/-/g,''));u.mustChange=false;u.fails=0;u.lockUntil=0;
  signIn(u);audit('Password reset','Reset with recovery code',u);save();UI.recCode=nc;
}
async function doForce(){
  const p=gv('cp-pass'),pr=pwProblem(p,gv('cp-pass2'));if(pr)return UI.authMsg=pr;
  const old=CU.pw,oldM=CU.mustChange;CU.pw=await hashPw(p);CU.mustChange=false;CU.mod=nowIso();
  if(svcOn()){pwQueue(CU.id,CU.pw);GHS.newCred={u:CRED.u,hash:CU.pw.hash,salt:CU.pw.salt};audit('Password changed','Chose a new password after reset');save();await ghSync();
    if(GHS.st==='err'){CU.pw=old;CU.mustChange=oldM;GH.pwq=(GH.pwq||[]).filter(x=>x.id!==CU.id);GHS.newCred=null;ghSaveCfg();return UI.authMsg='Could not save your new password to the sync service. '+GHS.msg}
    UI.authMsg='';return}
  audit('Password changed','Chose a new password after reset');save();UI.authMsg='';
}
async function doAcct(){
  const p=gv('ac-new'),pr=pwProblem(p,gv('ac-new2'));
  const curOk=svcOn()&&CRED?(await hashPw(gv('ac-cur'),CRED.salt)).hash===CRED.hash:await checkPw(gv('ac-cur'),CU.pw);
  if(!curOk){UI.acctMsg='Your current password is not correct.';return}
  if(pr){UI.acctMsg=pr;return}
  const old=CU.pw;CU.pw=await hashPw(p);CU.mod=nowIso();
  if(svcOn()){pwQueue(CU.id,CU.pw);GHS.newCred={u:CRED.u,hash:CU.pw.hash,salt:CU.pw.salt};audit('Password changed','');save();await ghSync();
    if(GHS.st==='err'){CU.pw=old;GH.pwq=(GH.pwq||[]).filter(x=>x.id!==CU.id);GHS.newCred=null;ghSaveCfg();UI.acctMsg='Could not save your new password to the sync service. '+GHS.msg;return}
    UI.acctMsg='';UI.modal=null;toast('Password changed.');return}
  audit('Password changed','');save();UI.acctMsg='';UI.modal=null;toast('Password changed.');
}
const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
async function mkUser({name,un,email,role,depts,pw}){
  const u={id:uid(),username:un,name,role,active:true,mustChange:true,created:nowIso(),mod:nowIso(),pw:await hashPw(pw)};
  if(email)u.email=email;if(role!=='admin'&&depts)u.depts=depts;
  S.users.push(u);pwQueue(u.id,u.pw);audit('User created',name+' ('+un+', '+roleName(role).toLowerCase()+')');return u;
}
const uniqueUn=base=>{let b=(base||'user').toLowerCase().replace(/[^a-z0-9._-]/g,'');if(b.length<3)b=(b+'user').slice(0,8);let n=b,i=2;while(S.users.some(x=>x.username===n))n=b+(i++);return n};
async function doUserAdd(){
  const name=gv('nu-name').trim(),un=gv('nu-user').trim().toLowerCase(),role=gv('nu-role')||'tech',p=gv('nu-pass'),email=gv('nu-email').trim().toLowerCase();
  if(!name||!/^[a-z0-9._-]{3,}$/.test(un))return toast('Enter a full name and a username of at least 3 letters or numbers.');
  if(S.users.some(x=>x.username===un))return toast('That username is already taken.');
  if(email&&!EMAIL_RE.test(email))return toast('That email address does not look right.');
  if(email&&S.users.some(x=>String(x.email||'').toLowerCase()===email))return toast('That email address already has an account.');
  if(p.length<8)return toast('The temporary password needs at least 8 characters.');
  let ds;if(role!=='admin'&&deptList().length){ds=deptList().filter(d=>{const e=document.getElementById('nu-d-'+d.id);return e&&e.checked}).map(d=>d.id);if(!ds.length)return toast('Choose at least one department for this user.')}
  const u=await mkUser({name,un,email,role,depts:ds,pw:p});
  UI.lastCred=email?{name,email,username:un,pw:p}:null;save();toast('User created. They choose their own password at first sign-in.');
}

async function doRequest(){
  const name=gv('rq-name').trim(),email=gv('rq-email').trim().toLowerCase();UI.rqName=name;UI.rqEmail=email;
  if(!name)return UI.authMsg='Enter your full name.';
  if(!EMAIL_RE.test(email))return UI.authMsg='Enter a valid email address. The administrator will send your temporary password there.';
  if(svcOn()){try{await svcCall('/request',{name,email},false)}catch(e){return UI.authMsg=e.message}}
  else{
    if(S.users.some(x=>String(x.email||'').toLowerCase()===email))return UI.authMsg='That email address already has an account. Try signing in, or ask an administrator to reset your password.';
    if(!S.requests.some(r=>r.email===email&&(!r.status||r.status==='pending'))){S.requests.push({id:uid(),name,email,at:nowIso(),status:'pending'});S.audit.push({id:uid(),at:nowIso(),by:null,byName:name,action:'Access requested',detail:name+' <'+email+'>',depts:[]});save()}
  }
  UI.reqDone=true;
}
async function doSvcConn(){
  const url=gv('sv-url').trim().replace(/\/+$/,'');
  if(!/^(https:\/\/|http:\/\/localhost)[^\s/]+/.test(url)){UI.ghMsg='Enter the service address, starting with https://';return}
  const old=GH;GH={...GH,svc:url,on:true};
  try{await svcCall('/ping',{},false)}catch(e){GH=old;UI.ghMsg=e.message;return}
  ghSaveCfg();UI.ghMsg='';UI.auth='';toast('Connected. Sign in with your QCLens username or email and password.');
}

async function approveReq(id){
  const r=S.requests.find(x=>x.id===id);if(!r)return;
  const role=gv('rq-role')||'tech';let ds;
  if(role!=='admin'&&deptList().length){ds=deptList().filter(d=>{const e=document.getElementById('rq-d-'+d.id);return e&&e.checked}).map(d=>d.id);if(!ds.length)return toast('Choose at least one department.')}
  if(S.users.some(x=>String(x.email||'').toLowerCase()===r.email))return toast('That email address already has an account.');
  const un=uniqueUn(r.email.split('@')[0]),pw=genPw();
  await mkUser({name:r.name,un,email:r.email,role,depts:ds,pw});
  r.status='approved';r.by=CU.name;r.decidedAt=nowIso();audit('Access request approved',r.name+' <'+r.email+'> as '+roleName(role).toLowerCase());
  UI.lastCred={name:r.name,email:r.email,username:un,pw};UI.appr=null;save();
}
async function doUserReset(){
  const id=UI.resetFor,u=S.users.find(x=>x.id===id),p=gv('rs-pass');
  if(!u)return;if(p.length<8)return toast('The temporary password needs at least 8 characters.');
  u.pw=await hashPw(p);u.mustChange=true;u.mod=nowIso();pwQueue(u.id,u.pw);u.fails=0;u.lockUntil=0;UI.resetFor=null;audit('Password reset by administrator',u.name+' ('+u.username+')');save();toast('Temporary password set for '+u.name+'.');
}
document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target.dataset.form;if(!f)return;
  UI.authMsg='';
  try{
    if(!(window.crypto&&crypto.subtle))throw new Error('nosubtle');
    if(f==='admin')await doAdmin();else if(f==='login')await doLogin();else if(f==='forgot')await doForgot();else if(f==='forcepw')await doForce();
    else if(f==='acct'){await doAcct();if(UI.acctMsg){const m=document.getElementById('ac-err');m.textContent=UI.acctMsg;m.hidden=false;return}}
    else if(f==='uadd'){if(!isAdmin())return;await doUserAdd()}
    else if(f==='ureset'){if(!isAdmin())return;await doUserReset()}
    else if(f==='svcadmin'){if(!isAdmin())return;await doSvcAdmin()}
    else if(f==='reqform')await doRequest();
    else if(f==='svcconn')await doSvcConn();
    else if(f==='ghconn'){if(CU&&!isAdmin())return;await doGhConnect()}
  }catch(err){UI.authMsg='Secure accounts are not available in this browser view.'}
  render();
});

function estStats(vals){

  const mean=vals.reduce((a,b)=>a+b,0)/n;

  return {n,mean,sd,cv:mean?sd/Math.abs(mean)*100:0,min:Math.min(...vals),max:Math.max(...vals)};
}
function estLevel(s,lv){

  const inc=rows.filter(x=>!x.ex).map(x=>x.v),st=estStats(inc);

  if(rows.length<2||!(st.sd>0))return '<div class="muted small" style="padding:24px 0;text-align:center">Add at least two values to see the chart.</div>';
  const zs=rows.map(x=>(x.v-st.mean)/st.sd),ymax=Math.max(3.5,Math.ceil((Math.max(...zs.map(Math.abs))+.3)*2)/2);

  s+=`<rect x="${ml}" y="${Y(1)}" width="${pw}" height="${Y(-1)-Y(1)}" fill="var(--zone1)"/><rect x="${ml}" y="${Y(3)}" width="${pw}" height="${Y(2)-Y(3)}" fill="var(--zone2)"/><rect x="${ml}" y="${Y(-2)}" width="${pw}" height="${Y(-3)-Y(-2)}" fill="var(--zone2)"/>`;

  if(!/^(https:\/\/|http:\/\/localhost)[^\s/]+/.test(url)){UI.ghMsg='Enter the service address, starting with https://';return}
  if(!CU||!CU.pw){UI.ghMsg='Sign in again with your password on this device, then connect.';return}
  const old=GH;GH={svc:url,on:true,pwq:[]};
  try{await svcCall('/ping',{},false)}catch(e){GH=old;UI.ghMsg=e.message;return}
  setCred({u:CU.username,hash:CU.pw.hash,salt:CU.pw.salt});ghSaveCfg();GHS.sha=null;GHS.lastHash=null;GHS.st='idle';
  await ghSync();
  if(GHS.st==='err'){const m=GHS.msg;GH=old;ghSaveCfg();setCred(null);UI.ghMsg=m;return}
  ghBoot2();UI.ghMsg='';audit('Sync service connected',url,null,[]);save();toast('Connected. Your data is saved to the sync service.');
}

/* ===== Westgard rules tab: shows every rule applied to QC points; admin switches them on or off ===== */
function ruleCounts(){
  const c={};RORDER.forEach(k=>c[k]=0);const res=VR();
  VA().forEach(a=>{const f=evaluate(a,res);Object.values(f).forEach(l=>l.forEach(x=>{if(c[x.rule]!=null)c[x.rule]++}))});
  const p=VA().length;return c;
}
function renderRules(){

  const card=k=>{const R=RULES[k],on=ruleOn(k),rej=R.sev==='reject';
    return `<div class="panelcard" style="${on?'':'opacity:.65'}"><div class="row" style="justify-content:space-between;align-items:flex-start;flex-wrap:nowrap;gap:12px">
     <div><div class="row" style="gap:8px"><b style="font-size:1.05em">${R.name}</b><span class="chip ${rej?'bad':'warn'}">${rej?'Rejection rule':'Warning rule'}</span><span class="chip ${on?'good':''}">${on?'On':'Off'}</span></div>

   case 'skip':stashDrafts();UI.skipOpen=id;break;
   case 'skipcancel':UI.skipOpen=null;break;
   case 'skipok':{const a=anOf(id);S.skips=S.skips.filter(s=>!(s.aid===id&&s.date===UI.date));const rsn=document.getElementById('skr-'+id).value.trim();S.skips.push({aid:id,date:UI.date,reason:rsn,...stampNow()});audit('Marked not performed',a.name+' on '+fmtDate(UI.date)+(rsn?': '+rsn:''));UI.skipOpen=null;save();toast(a.name+' marked as not performed on '+fmtDate(UI.date)+'.');break}
   case 'unskip':audit('Not performed undone',(anOf(id)||{}).name+' on '+fmtDate(UI.date));S.skips=S.skips.filter(s=>!(s.aid===id&&s.date===UI.date));break;
   case 'override':{const c=document.getElementById('ov-'+id).value.trim();if(!c){toast('Write a comment before overriding.');return}
     const r=S.results.find(x=>x.id===id);r.ov={comment:c,...stampNow()};audit('Override',(anOf(r.aid)||{}).name+' '+levelName(r.lv)+' '+fmtDate(r.date)+' value '+r.value+': '+c);save();toast('Override recorded with your comment.');break}
   case 'unoverride':{const r=S.results.find(x=>x.id===id);r.ov=null;audit('Override removed',(anOf(r.aid)||{}).name+' '+levelName(r.lv)+' '+fmtDate(r.date));break}
   case 'delres':{tomb(id);const r=S.results.find(x=>x.id===id);if(r)audit('QC result deleted',(anOf(r.aid)||{}).name+' '+levelName(r.lv)+' '+fmtDate(r.date)+' value '+r.value+(r.byName?' (entered by '+r.byName+')':''))}UI.draft={};S.results=S.results.filter(x=>x.id!==id);UI.report=UI.report.filter(x=>x!==id);break;
   case 'lot':UI.modal={aid:id};break;
   case 'addopen':{const f=DA().find(x=>x.panel===el.dataset.p);UI.modal={add:true,panel:el.dataset.p,n:f?f.nlev:st.nlev};break}
   case 'sugg':{const rp=panelsNow().find(p=>p.name===el.dataset.p),it=rp.items.find(i=>i.name===el.dataset.n),f=DA().find(x=>x.panel===el.dataset.p);
     UI.modal={add:true,panel:el.dataset.p,n:f?f.nlev:st.nlev,name:it.name,unit:st.units[it.name]!=null?st.units[it.name]:it.unit};break}
   case 'addsave':if(saveAdd())return;break;
   case 'arem':if(nRes(id)&&UI.confirmDel!==id){UI.confirmDel=id;break}{const an=anOf(id);audit('Analyte removed',an?an.name+' ('+an.panel+')'+(nRes(id)?' with '+nRes(id)+' results':''):'');}removeAnalyte(id);UI.confirmDel=null;toast('Analyte removed.');break;
   case 'arcancel':UI.confirmDel=null;break;
   case 'mnp':{const n=document.getElementById('mnewpanel').value.trim();if(!n)return toast('Give the panel a name.');
     if(panelNames().concat(panelsNow().map(p=>p.name)).some(x=>x.toLowerCase()===n.toLowerCase()))return toast('A panel with that name already exists.');
     st.cpanels.push({id:uid(),name:n,items:[]});toast('Panel created. Use Add analyte to put tests in it.');break}
   case 'pdel':{const pn=el.dataset.p,ids=DA().filter(a=>a.panel===pn).map(a=>a.id);
     if(UI.confirmDel!=='p:'+pn){UI.confirmDel='p:'+pn;break}
     const nr=ids.reduce((n,i)=>n+nRes(i),0);audit('Panel deleted',pn+' ('+ids.length+' analytes, '+nr+' results)');
     ids.forEach(removeAnalyte);st.cpanels=st.cpanels.filter(c=>c.name!==pn);if(st.sel)delete st.sel[pn];UI.confirmDel=null;toast('Panel deleted.');break}
   case 'mclose':UI.modal=null;UI.lateReason=null;break;
   case 'lateok':{const v=(document.getElementById('late-note')||{value:''}).value.trim();if(!v){const e=document.getElementById('late-err');e.textContent='Write a reason before saving.';e.hidden=false;return}UI.lateReason=v;UI.modal=null;saveQC();render();return}
   case 'msave':return saveLot()||render();
   case 'xl':{const a=anOf(id);return exportXlsx([a],'QCLens-'+a.name.replace(/[^\w-]+/g,'_')+'-'+todayStr()+'.xlsx')}
   case 'xlall':return exportXlsx(VA(),'QCLens-all-analytes-'+todayStr()+'.xlsx');
   case 'backup':return backupJson();
   case 'reset1':UI.confirmReset=true;break;
   case 'reset0':UI.confirmReset=false;break;
   case 'reset2':{const keep={u:S.users,a:S.audit};S=blank();S.users=keep.u;S.audit=keep.a;audit('Data reset','All setup and QC data deleted');}UI.confirmReset=false;UI.editing=false;UI.draft={};break;
  }
  save();render();
});
document.addEventListener('change',e=>{
  if(estChange(e))return;
  const t=e.target,st=S.setup,d=t.dataset;
  if(!CU)return;
  if(!canSetup()&&!(t.id==='qcdate'||t.id==='cid'||t.id==='win'||/^(m-|ac-)/.test(t.id)))return;
  if(t.id==='af-user'){AF.user=t.value;AF.limit=100;return render()}
  if(t.id==='af-act'){AF.act=t.value;AF.limit=100;return render()}
  if(t.id==='af-from'){AF.from=t.value;AF.limit=100;return render()}
  if(t.id==='af-to'){AF.to=t.value;AF.limit=100;return render()}
  if(d.rulet){if(!isAdmin())return;S.rules=S.rules||{};const on=t.checked;if(on)delete S.rules[d.rulet];else S.rules[d.rulet]=false;S.rulesAt=nowIso();audit('Westgard rule '+(on?'switched on':'switched off'),RULES[d.rulet].name,null,[]);save();return render()}
  if((d.udept||d.urole)&&!isAdmin())return;
  if(d.path==='dept'&&!isAdmin())return;
  if(d.udept){const [uid_,did]=d.udept.split(':'),u=S.users.find(x=>x.id===uid_);if(!u)return;
    const cur=Array.isArray(u.depts)?u.depts.slice():deptList().map(x=>x.id);
    u.depts=t.checked?[...new Set([...cur,did])]:cur.filter(x=>x!==did);u.mod=nowIso();
    const nm=(deptList().find(x=>x.id===did)||{}).dept;audit('User departments changed',u.name+': '+(t.checked?'added ':'removed ')+nm+' ('+(u.depts.map(i=>(deptList().find(x=>x.id===i)||{}).dept).join(', ')||'none')+')');save();return render()}
  if(d.urole){const u=S.users.find(x=>x.id===d.urole);if(!u)return;
    if(u.role==='admin'&&t.value!=='admin'&&nAdmins()<=1){toast('There must be at least one active administrator.');return render()}
    audit('Role changed',u.name+': '+roleName(u.role).toLowerCase()+' to '+roleName(t.value).toLowerCase());u.role=t.value;u.mod=nowIso();save();return render()}
  if(d.mre!==undefined&&UI.modal&&UI.modal.add){const dr=readAdd();UI.modal.d=dr;if(t.id==='a-n')UI.modal.n=+t.value;
    if(t.id==='a-pick'&&t.value){const [pp,nn]=t.value.split('|'),it=panelsNow().find(p=>p.name===pp).items.find(i=>i.name===nn);dr.name=it.name;dr.unit=st.units[it.name]!=null?st.units[it.name]:it.unit}
    return render()}
  if(d.aunit){setUnit(anOf(d.aunit),t.value.trim());save();return}
  if(d.rnp){const oldN=d.rnp,v=t.value.trim(),cp=st.cpanels.find(c=>c.name===d.rnp);
    if(!v||(v!==d.rnp&&panelNames().concat(panelsNow().map(p=>p.name)).some(x=>x.toLowerCase()===v.toLowerCase()))){toast(v?'A panel with that name already exists.':'Panel name cannot be empty.');return render()}
    DA().forEach(a=>{if(a.panel===d.rnp)a.panel=v});cp.name=v;save();document.querySelectorAll('[data-rnp]').forEach(x=>{if(x.getAttribute('data-rnp')===oldN){x.setAttribute('data-rnp',v);x.value=v}});document.querySelectorAll('[data-p]').forEach(x=>{if(x.getAttribute('data-p')===oldN)x.setAttribute('data-p',v)});return}
  if(d.path){st[d.path]=t.value;
    if(d.path==='dept'){st.sub=Object.keys(CAT[t.value].subs)[0];st.analyser='';st.analysers=[];st.amods={};st.selFor=''}
    if(d.path==='sub')st.selFor='';
    save();return render()}
  if(d.an){const [p,n]=d.an.split('|');(st.sel[p]||(st.sel[p]={}))[n]=t.checked?1:0;save();return render()}
  if(d.cu!==undefined){const [ci,ii]=d.cu.split(':');st.cpanels[+ci].items[+ii].on=t.checked;save();return render()}
  if(d.unit!==undefined){const def=panelsNow().flatMap(p=>p.items).find(i=>i.name===d.unit),v=t.value.trim();
    if(def&&v===def.unit)delete st.units[d.unit];else st.units[d.unit]=v;save();return}
  if(d.cunit!==undefined){const [ci,ii]=d.cunit.split(':');st.cpanels[+ci].items[+ii].unit=t.value.trim();save();return}
  if(d.sched){const a=anOf(d.sched);a.schedule={type:t.value,days:t.value==='weekdays'?[1]:undefined,every:2,start:todayStr()};save();return render()}
  if(d.psched){if(!t.value)return;const g0=(t.closest('.panelcard')||{dataset:{}}).dataset.g;DA().filter(a=>a.panel===d.psched&&(g0==null||(instOf(a)||'No analyser')===g0)).forEach(a=>a.schedule={type:t.value,days:t.value==='weekdays'?[1,4]:undefined,every:2,start:todayStr()});save();return render()}
  if(d.dow){const [id,dw]=d.dow.split(':'),a=anOf(id),s=a.schedule;s.days=s.days||[];const n=+dw;s.days=t.checked?[...new Set([...s.days,n])]:s.days.filter(x=>x!==n);save();return}
  if(d.every){anOf(d.every).schedule.every=Math.max(2,+t.value||2);save();return}
  if(d.start){anOf(d.start).schedule.start=t.value;save();return}
  if(d.inst){const a=anOf(d.inst);if(a){const v=splitInst(t.value);a.inst=v.inst;a.mod=v.mod;save();if(!UI.editing)render()}return}
  if(d.pinst){if(!t.value)return;const g=(t.closest('.panelcard')||{dataset:{}}).dataset.g,v=splitInst(t.value);DA().filter(a=>a.panel===d.pinst&&(g==null||(instOf(a)||'No analyser')===g)).forEach(a=>{a.inst=v.inst;a.mod=v.mod});save();return render()}
  if(d.amod){const k=d.amod.indexOf(':'),i=+d.amod.slice(0,k),m=d.amod.slice(k+1),n=st.analysers[i];if(n==null)return;const l=st.amods[n]||(st.amods[n]=[]);
    if(t.checked){if(!l.includes(m))l.push(m)}else{st.amods[n]=l.filter(x=>x!==m);DA().forEach(a=>{if(a.inst===n&&a.mod===m)a.mod=''})}save();return render()}
  if(d.amodnew!==undefined){const n=st.analysers[+d.amodnew],v=t.value.trim();if(n==null||!v)return;const l=st.amods[n]||(st.amods[n]=[]);if(!l.includes(v))l.push(v);save();return render()}
  if(d.lexp){const [id,lv]=d.lexp.split(':');anOf(id).targets[0].levels[+lv].exp=t.value;save();return refreshNext()}
  if(d.asg){if(t.checked)UI.asg[d.asg]=1;else delete UI.asg[d.asg];const n=Object.keys(UI.asg).length,b=document.querySelector('[data-act="asgmove"]');if(b)b.disabled=!n;return}
  if(t.id==='as-target'){UI.asgT=t.value;return render()}
  if(t.id==='as-new'){UI.asgNew=t.value;UI.asgName='';UI.asgMod='';return render()}
  if(t.id==='as-newmod'){UI.asgMod=t.value;return}
  if(t.id==='as-newname'){UI.asgName=t.value;return}
  if(t.id==='instf'){UI.inst=t.value;return render()}
  if(t.id==='deptf'){UI.dept=t.value;UI.inst='';return render()}
  if(t.id==='deptsw'){if(!canSeeD(t.value))return;syncCtx();loadCtx(t.value);save();return render()}
  if(d.llot){const [id,lv]=d.llot.split(':');anOf(id).targets[0].levels[+lv].lot=t.value.trim();save();return}
  if(d.lmat){const [id,lv]=d.lmat.split(':');anOf(id).targets[0].levels[+lv].material=t.value.trim();save();return refreshNext()}
  if(d.nlev){const a=anOf(d.nlev);a.nlevCustom=true;setLevels(a,+t.value);save();return render()}
  if(d.tg){const [id,lv,f]=d.tg.split(':');anOf(id).targets[0].levels[+lv][f]=num(t.value);save();return refreshNext()}
  if(t.id==='qcdate'){UI.date=t.value||todayStr();UI.report=[];UI.skipOpen=null;return render()}
  if(t.id==='cid'){UI.cid=t.value;return render()}
  if(t.id==='win'){UI.win=+t.value;return render()}
  if(t.id==='restore'&&t.files[0]){const fr=new FileReader();fr.onload=()=>{try{const o=JSON.parse(fr.result);if(!o||!Array.isArray(o.analytes)||!o.setup)throw 0;const kU=S.users,kA=S.audit;S=norm(o);if(!S.users.length)S.users=kU;if(!S.audit.length)S.audit=kA;UI.editing=false;CU=S.users.find(u=>u.id===(SESS&&SESS.uid)&&u.active!==false)||null;if(!CU){SESS=null;writeSess()}else audit('Backup restored','Data restored from a backup file');save();render();toast('Backup restored.')}catch(x){toast('That file is not a valid QC backup.')}};fr.readAsText(t.files[0])}
});
document.addEventListener('toggle',e=>{if(e.target.hasAttribute&&e.target.hasAttribute('data-more'))UI.moreOpen=e.target.open},true);
/* chart tooltips */
document.addEventListener('pointerover',e=>{
  const h=e.target.closest&&e.target.closest('.hit');if(!h)return;
  const box=h.closest('.chartbox');let tip=box.querySelector('.tip');
  if(!tip){tip=document.createElement('div');tip.className='tip';box.appendChild(tip)}
  tip.innerHTML=h.dataset.tip;tip.hidden=false;
  const b=box.getBoundingClientRect(),c=h.getBoundingClientRect();
  tip.style.left=Math.min(Math.max(0,c.left-b.left+c.width/2-60),Math.max(0,b.width-190))+'px';
  tip.style.top=(c.top-b.top-tip.offsetHeight-8)+'px';
});
document.addEventListener('pointerout',e=>{const h=e.target.closest&&e.target.closest('.hit');if(h){const t=h.closest('.chartbox').querySelector('.tip');if(t)t.hidden=true}});
if(ghOn()&&(!GH.svc||CRED)){UI.cfgWait=true;render();ghSync().catch(()=>{}).finally(()=>{UI.cfgWait=false;restoreSess();render()})}else{restoreSess();render()}

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches&&e.target.matches('[data-amodnew]')){e.preventDefault();e.target.dispatchEvent(new Event('change',{bubbles:true}))}});
ghBoot();
</script>
