<style>
/* Layout: sticky instrument-style header with tabs; single working column (max 1100px); chart panel with SD-unit axis and value labels on the right. */
:root{
  --bg:#EDF1F2; --surface:#FFFFFF; --surface2:#F5F8F9; --ink:#15222B; --muted:#55666F; --line:#D3DBDF;
  --accent:#0B7A6F; --accent-ink:#FFFFFF; --accent-soft:#DDF0EA; --logo-bg:transparent;
  --good:#2A7A4B; --warn:#A35F00; --bad:#BF3A2D; --bad-soft:#FBE7E4; --warn-soft:#FBEFD9; --good-soft:#E1F1E7;
  --grid:#E1E7EA; --zone1:#F2F6F7; --zone2:#FBF3DF; --zone3:#FBE6E3;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --cond:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E161B; --surface:#16212A; --surface2:#1B2832; --ink:#E5ECEF; --muted:#9AABB4; --line:#2B3A44;
  --accent:#4FC1CC; --accent-ink:#04262A; --accent-soft:#17383D; --logo-bg:#EEF3F5;
  --good:#5CC48A; --warn:#E5A445; --bad:#F27766; --bad-soft:#3A1F1C; --warn-soft:#37290F; --good-soft:#15301F;
  --grid:#25333D; --zone1:#182630; --zone2:#2A2713; --zone3:#33201E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E161B; --surface:#16212A; --surface2:#1B2832; --ink:#E5ECEF; --muted:#9AABB4; --line:#2B3A44;
  --accent:#4FC1CC; --accent-ink:#04262A; --accent-soft:#17383D; --logo-bg:#EEF3F5;
  --good:#5CC48A; --warn:#E5A445; --bad:#F27766; --bad-soft:#3A1F1C; --warn-soft:#37290F; --good-soft:#15301F;
  --grid:#25333D; --zone1:#182630; --zone2:#2A2713; --zone3:#33201E; color-scheme:dark}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--cond);font-weight:600;margin:0;letter-spacing:.01em;text-wrap:balance}
h2{font-size:22px} h3{font-size:16px}
.wrap{max-width:1100px;margin:0 auto;padding-block:16px 48px}
header.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding-block:14px 10px}
.brand{display:flex;flex-direction:row;align-items:center;gap:14px;min-width:0}
.logo{display:block;height:88px;width:auto;max-width:100%;background:var(--logo-bg);border-radius:10px;padding:2px 8px}
.brand span{color:var(--muted);font-size:13px;min-width:0}
.auth{min-height:75vh;display:flex;align-items:center;justify-content:center;padding-block:28px}
.authcard{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;display:flex;flex-direction:column;gap:18px}
.authcard .logo.big{height:auto;width:min(250px,100%);margin:0 auto;padding:6px 12px}
.authcard form .btn{width:100%}
.amsg{margin:0;padding:8px 10px;border-radius:6px;background:var(--bad-soft);color:var(--bad);font-size:13px;border:1px solid var(--bad)}
.reccode{font:600 22px var(--mono);letter-spacing:.08em;text-align:center;padding:16px 8px;border:1px dashed var(--accent);border-radius:8px;background:var(--accent-soft);user-select:all;word-break:break-all}
.userbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.userbar .who{display:flex;align-items:center;gap:8px;margin-right:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:18px}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:500 14px var(--sans);padding:10px 14px;cursor:pointer;display:flex;gap:6px;align-items:center}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{background:var(--bad);color:#fff;border-radius:99px;font:600 11px var(--mono);padding:1px 7px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 13px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.green{background:#B0DD60;color:#15222B;border-color:#8FC23F;font-weight:600}
.btn.green:hover{background:#A2D24E}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
input[type=number]{font-family:var(--mono)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.row>*{min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.muted{color:var(--muted)} .mono{font-family:var(--mono)} .small{font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:500;border:1px solid var(--line);background:var(--surface2)}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.chip.good{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.steps span{font:500 12.5px var(--sans);padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.steps span.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.steps span.done{color:var(--ink)}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{font:600 11.5px var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:6px 8px;border-bottom:1px solid var(--grid);vertical-align:middle}
.scroll{overflow-x:auto}
.panelcard{border:1px solid var(--line);border-radius:8px;background:var(--surface2);padding:12px}
.panelcard h3{display:flex;justify-content:space-between;gap:8px;align-items:center}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px}
.checks.col{flex-direction:column;flex-wrap:nowrap;gap:6px}
.arow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.arow label{min-width:0}
input.unitin[type=text]{width:92px;padding:3px 7px;font:12px var(--mono);flex:none}
.checks label{display:flex;gap:6px;align-items:center;cursor:pointer}
.due{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;padding:12px;border-bottom:1px solid var(--grid)}
.due:last-child{border-bottom:0}
.due .nm{font-weight:600;flex:1 1 170px;min-width:0}
.due label.f{flex:1 1 120px;max-width:200px}
.due .btn{flex:none}
.due.skipped{opacity:.8;background:var(--surface2)}
.alert{border:1px solid var(--bad);background:var(--bad-soft);border-radius:8px;padding:12px 14px}
.alert.warn{border-color:var(--warn);background:var(--warn-soft)}
.alert ul{margin:6px 0 0 18px;padding:0}
.alert li{margin:2px 0}
.chartbox{position:relative}
svg.lj{width:100%;height:auto;display:block;overflow:visible}
svg.lj text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
svg.lj .ax{stroke:var(--grid);stroke-width:1}
svg.lj .mean{stroke:var(--accent);stroke-width:1.6}
svg.lj .s1{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 4;opacity:.8}
svg.lj .s2{stroke:var(--warn);stroke-width:1.2;stroke-dasharray:6 4}
svg.lj .s3{stroke:var(--bad);stroke-width:1.4}
svg.lj .line{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.55}

.sp-t,.sp-s{pointer-events:none}
svg.lj .sp-t{fill:var(--warn);opacity:.16;stroke:var(--warn);stroke-dasharray:4 3;stroke-width:1}
svg.lj .sp-s{fill:var(--bad);opacity:.1;stroke:var(--bad);stroke-dasharray:4 3;stroke-width:1}
svg.lj .spl{font-size:11px;font-weight:600}svg.lj .spl-t{fill:var(--warn)}svg.lj .spl-s{fill:var(--bad)}
.panelcard.locked{opacity:.62;background:var(--surface2)}
.arow.lk label{color:var(--muted)}
.angrp{margin-bottom:14px}
.angh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700;font-size:15px;padding:8px 2px;margin:4px 0 6px;border-bottom:2px solid var(--accent)}
svg.lj .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
svg.lj .pt.w{fill:var(--warn)} svg.lj .pt.r{fill:var(--bad)}
svg.lj .pt.ex{fill:var(--muted);opacity:.45}
svg.lj .pt.ov{fill:var(--surface);stroke:var(--bad);stroke-width:2.5}
svg.lj .ring{fill:none;stroke:var(--bad);stroke-width:2}
svg.lj .lotline{stroke:var(--accent);stroke-width:1.2;stroke-dasharray:3 3}
svg.lj text.lab{fill:var(--ink);font-weight:500}
svg.lj text.l3{fill:var(--bad)} svg.lj text.l2{fill:var(--warn)} svg.lj text.lm{fill:var(--accent);font-weight:500}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:6px;padding:6px 9px;font-size:12px;z-index:5;max-width:240px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:50;max-width:90vw}
.modalbg{position:fixed;inset:0;background:rgba(10,18,22,.55);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto;z-index:40}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;max-width:620px;width:100%}
.hint{background:var(--accent-soft);border-radius:6px;padding:8px 11px;font-size:12.5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days label{border:1px solid var(--line);border-radius:6px;padding:3px 8px;cursor:pointer;font-size:12.5px;background:var(--surface)}
.days input{position:absolute;opacity:0;pointer-events:none}
.days label:has(input:checked){background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.days label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.empty{padding:28px;text-align:center;color:var(--muted)}

@media (max-width:640px){
  body{font-size:15px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .wrap{padding-block:8px 32px}
  header.top{gap:8px 12px;padding-block:8px 6px}
  .logo{height:52px}
  .brand{gap:10px;width:100%}
  .brand span{font-size:12.5px}
  .userbar{width:100%;justify-content:space-between}
  .userbar .who{flex:1 1 100%;margin:0}
  nav.tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-inline:-12px;padding-inline:12px;margin-bottom:12px}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{white-space:nowrap;padding:12px 12px;flex:none}
  .btn{min-height:42px;padding:9px 14px}
  .btn.sm{min-height:36px;padding:6px 11px}
  input[type=text],input[type=password],input[type=number],input[type=date],input[type=email],select,textarea{font-size:16px;min-height:42px}
  input[type=checkbox]{width:20px;height:20px}
  .panel{padding:12px;border-radius:8px}
  h2{font-size:20px}
  .grid2{grid-template-columns:1fr}
  .row{gap:10px}
  .due{padding:10px 8px;gap:8px 10px}
  .due .nm{flex:1 1 100%}
  .due label.f{flex:1 1 calc(50% - 10px);max-width:none}
  .due .btn{flex:1 1 100%}
  .auth{min-height:auto;padding-block:12px;align-items:flex-start}
  .authcard{padding:18px;gap:14px}
  .modalbg{padding:0;align-items:flex-end}
  .modal{max-width:none;max-height:92vh;overflow-y:auto;border-radius:14px 14px 0 0;padding:16px}
  .modal .row{justify-content:stretch}
  .modal .row .btn{flex:1 1 auto}
  table.t td,table.t th{padding:8px 6px}
  .toast{left:12px;right:12px;max-width:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.sitefoot{margin:36px 0 8px;padding-top:14px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:13px}
</style>

/* ===== Engine: dates, targets, Westgard rules ===== */
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr=()=>dstr(new Date());
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const dowOf=s=>pd(s).getDay();
const daysBetween=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const fmtDate=s=>{const d=pd(s);return DOW[d.getDay()]+' '+pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()};
const shortDate=s=>pad(pd(s).getDate())+'/'+pad(pd(s).getMonth()+1);

function isDue(a,date){
  const s=a.schedule||{type:'daily'};
  if(s.type==='daily')return true;
  if(s.type==='weekdays')return (s.days||[]).includes(dowOf(date));
  if(s.type==='ondemand')return false;
  if(s.type==='interval'){const n=Math.max(1,+s.every||1);const k=daysBetween(s.start||date,date);return k>=0&&k%n===0}
  return true;
}
function scheduleText(a){
  const s=a.schedule||{type:'daily'};
  if(s.type==='daily')return 'Every day';
  if(s.type==='ondemand')return 'On demand (no fixed schedule)';
  if(s.type==='weekdays')return (s.days||[]).length?(s.days||[]).slice().sort().map(d=>DOW[d]).join(', '):'No days chosen';
  return 'Every '+s.every+' days from '+fmtDate(s.start);
}
function targetIndex(a,date){
  let idx=0;
  a.targets.forEach((t,i)=>{if(t.from<=date)idx=i});
  return idx;
}
/* a lot change or target adjustment only counts for a control level when that level's mean, SD, material or lot changed */
function lvChanged(a,i,lv){const p=(a.targets[i-1]||{levels:[]}).levels[lv],c=(a.targets[i]||{levels:[]}).levels[lv];if(!p||!c)return p!==c;
  return p.mean!==c.mean||p.sd!==c.sd||(p.lot||'')!==(c.lot||'')||(p.material||'')!==(c.material||'')}
function lvEra(a,lv,date){const ti=targetIndex(a,date);let e=0;for(let i=1;i<=ti;i++)if(lvChanged(a,i,lv))e++;return e}
const targetFor=(a,date)=>a.targets[targetIndex(a,date)];
const curTarget=a=>targetFor(a,todayStr());
const zOf=(a,r)=>{const t=targetFor(a,r.date).levels[r.lv];return t&&t.sd>0?(r.value-t.mean)/t.sd:0};

const RULES={
 '1-2s':{sev:'warn',name:'1₂ₛ warning',desc:'One control is more than 2 SD from the mean.',
   fix:['Warning only. Accept the run if no other rule is broken.','Look at the chart for a trend or shift building up.','Check the other control level in the same run.','Watch the next run closely.']},
 '1-3s':{sev:'reject',name:'1₃ₛ',desc:'One control is more than 3 SD from the mean (random error, or a large systematic error).',
   fix:['Re-run the same control with a fresh aliquot or vial.','Check the sample probe, bubbles, clots and short sampling.','Confirm the control was thawed, mixed and labelled correctly and is within expiry.','Check reagent volume, reagent expiry and on-board stability.','If it repeats, calibrate and re-run both levels before reporting patient results.']},
 '2-2s':{sev:'reject',name:'2₂ₛ',desc:'Two consecutive controls are more than 2 SD on the same side of the mean (systematic error).',
   fix:['Calibrate the analyte, then re-run both control levels.','Open a fresh reagent pack or a new reagent lot and check storage temperature.','Open a new control vial in case the current one has deteriorated.','Check recent maintenance, lamp, ISE electrodes, probe and water quality.','Hold patient results until QC is back within limits.']},
 'R-4s':{sev:'reject',name:'R₄ₛ',desc:'Two controls in one run are more than 4 SD apart: one above +2 SD and one below −2 SD (random error).',
   fix:['Re-run both levels with fresh aliquots.','Check pipetting, mixing, bubbles and sample probe condition.','Check for electrical noise, unstable temperature and cuvette or electrode problems.','Review the reagent and control handling steps.','Repeat QC. Persistent R₄ₛ needs service or maintenance.']},
 '4-1s':{sev:'reject',name:'4₁ₛ',desc:'Four consecutive controls are more than 1 SD on the same side of the mean (small systematic shift).',
   fix:['Calibrate and re-run QC.','Check whether a reagent or calibrator lot changed recently.','Compare against another analyser or a peer group if available.','Check scheduled maintenance, lamp hours and reagent deterioration.','If the shift is real after a lot change, review the target mean (Lot change button).']},
 '10x':{sev:'reject',name:'10ₓ',desc:'Ten consecutive controls fall on the same side of the mean (persistent bias).',
   fix:['Look for a gradual drift: reagent, calibrator, control or lamp ageing.','Calibrate and re-run QC.','Check whether the target mean still matches the current lot.','Review maintenance and environmental changes (temperature, water).','Document the investigation, then override with a comment if the run is judged acceptable.']},
 'T7':{sev:'warn',name:'Trend (7T)',desc:'Seven or more consecutive controls of one level move steadily in the same direction (gradual drift).',
   fix:['Check the reagent: deteriorating, near its on-board stability limit or stored warm. Replace with a fresh pack.','Check the control and calibrator material: evaporation, long-open vial, or storage temperature.','Check lamp hours, electrode or probe wear, cuvette condition and reagent compartment temperature.','Review water quality and recent maintenance.','Calibrate and re-run QC. If the drift continues, open a new reagent or control lot and compare.','Look at the patient moving average for the same drift.']},
 'S6':{sev:'warn',name:'Shift (6x)',desc:'Six or more consecutive controls of one level fall on the same side of the mean (early sign of a shift).',
   fix:['Ask what changed when the shift began: new reagent lot or pack, calibration, control vial or lot, maintenance, lamp or electrode change.','Check that calibration used the correct calibrator lot and passed its acceptance checks.','Recalibrate and re-run QC; compare with another analyser or peer group.','If a new control lot started the shift, record it with Lot change and a comment so the target is updated.','Check the patient moving average before the shift becomes a rejection (4₁ₛ or 10ₓ).']}
};
/* trends and shifts per control level: runs of points that drift or sit on one side of the mean */
const RORDER=['1-2s','1-3s','2-2s','R-4s','4-1s','10x','T7','S6'];
const SCOPED=['2-2s','4-1s','10x'];
const SCOPE_TXT={both:'Within each level or across levels (either one triggers it)',within:'Within each level only (each level on its own)',across:'Across levels only (all levels together, in the order they were run)'};
/* rules are set for the whole laboratory, and a department can have its own set (S.drules[deptId]) */
const rulesFor=d=>{try{const o=d&&S.drules&&S.drules[d];return o||S.rules||{}}catch(e){return {}}};
const hasOwnRules=d=>{try{return !!(d&&S.drules&&S.drules[d])}catch(e){return false}};
const scopeOf=(k,d)=>{const v=rulesFor(d)[k+'@'];return v==='within'||v==='across'?v:'both'};
const ruleOn=(k,d)=>rulesFor(d)[k]!==false;
function patternsFor(a,lv,results){
  const rs=results.filter(r=>r.aid===a.id&&r.lv===lv).sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:0),segs={};
  rs.forEach(r=>{const k=lvEra(a,lv,r.date);(segs[k]||(segs[k]=[])).push({r,z:zOf(a,r)})});
  const out=[],push=(kind,dir,w,seg)=>out.push({kind,dir,lv,ids:w.map(p=>p.r.id),n:w.length,from:w[0].r.date,to:w[w.length-1].r.date,open:w[w.length-1]===seg[seg.length-1]});
  Object.values(segs).forEach(seg=>{
    let i=0;while(i<seg.length){ // shift: same side of the mean
      const s=Math.sign(seg[i].z);if(!s){i++;continue}
      let j=i;while(j+1<seg.length&&Math.sign(seg[j+1].z)===s)j++;
      if(j-i+1>=6)push('shift',s,seg.slice(i,j+1),seg);i=j+1}
    i=0;while(i<seg.length-1){ // trend: steadily rising or falling
      const d=Math.sign(seg[i+1].z-seg[i].z);if(!d){i++;continue}
      let j=i+1;while(j+1<seg.length&&Math.sign(seg[j+1].z-seg[j].z)===d)j++;
      if(j-i+1>=7)push('trend',d,seg.slice(i,j+1),seg);i=d?j:j+1}
  });
  return out.filter(p=>ruleOn(p.kind==='shift'?'S6':'T7',a.dept));
}
function evaluate(a,results){
  const out={}; // resultId -> [{rule,sev}]
  const D=a.dept,add=(r,rule)=>{if(!ruleOn(rule,D))return;const o=out[r.id]||(out[r.id]=[]);if(!o.some(x=>x.rule===rule))o.push({rule,sev:RULES[rule].sev})};
  const rs=results.filter(r=>r.aid===a.id).sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:x.lv-y.lv);
  const segs={};
  rs.forEach(r=>{const k=targetIndex(a,r.date);(segs[k]||(segs[k]=[])).push({r,z:zOf(a,r)})});
  Object.values(segs).forEach(seg=>{
    seg.forEach(p=>{const m=Math.abs(p.z);if(m>3)add(p.r,'1-3s');else if(m>2)add(p.r,'1-2s')});
    const byLv={};seg.forEach(p=>(byLv[p.r.lv]||(byLv[p.r.lv]=[])).push(p));
    const byDate={};seg.forEach(p=>(byDate[p.r.date]||(byDate[p.r.date]=[])).push(p));
    const runs=(arr,n,test,rule)=>{for(let i=n-1;i<arr.length;i++){const w=arr.slice(i-n+1,i+1);if(w.every(p=>test(p.z,w[0].z)))add(arr[i].r,rule)}};
    const multi=Object.keys(byLv).length>1,wi=k=>!multi||scopeOf(k,D)!=='across',ac=k=>multi&&scopeOf(k,D)!=='within';
    // across levels, chronological stream of all levels
    if(multi){

}

function deptChoices(){
  const out=DEPTS.filter(d=>d!=='Other / Custom');
  (S.depts||[]).forEach(r=>{if(r.dept&&!out.includes(r.dept)&&r.dept!=='Other / Custom')out.push(r.dept)});
  if(S.setup.dept&&!out.includes(S.setup.dept)&&S.setup.dept!=='Other / Custom')out.push(S.setup.dept);
  out.push('Other / Custom');return out;
}
function subList(dept){
  const base=Object.keys((CAT[dept]||{subs:{}}).subs),out=base.slice();
  const add=n=>{if(n&&!out.some(x=>x.toLowerCase()===String(n).toLowerCase()))out.push(n)};
  (S.depts||[]).forEach(r=>{if(r.dept===dept)add(r.sub)});
  if(S.setup.dept===dept)add(S.setup.sub);
  return out;
}
const subKey=()=>S.setup.dept+'|'+S.setup.sub;
const panelsNow=()=>((CAT[S.setup.dept]||{subs:{}}).subs[S.setup.sub]||[]).map(p=>({...p,items:p.items.concat((S.setup.padd||{})[subKey()+'|'+p.name]||[])}));
function ensureSel(){
  const st=S.setup;
  if(st.selFor===subKey())return;
  st.selFor=subKey();st.sel={};
  panelsNow().forEach(p=>{if(p.routine){st.sel[p.name]={};p.items.forEach(i=>st.sel[p.name][i.name]=1)}});
}
function chosenList(){
  const seen={},out=[];
  const st=S.setup;
  panelsNow().forEach(p=>p.items.forEach(i=>{if(st.sel[p.name]&&st.sel[p.name][i.name]&&!seen[i.name]){seen[i.name]=1;out.push({name:i.name,unit:st.units[i.name]!=null?st.units[i.name]:i.unit,panel:p.name})}}));
  st.cpanels.forEach(cp=>cp.items.forEach(c=>{if(c.on!==false&&!seen[c.name.toLowerCase()]&&!seen[c.name]){seen[c.name]=1;out.push({name:c.name,unit:c.unit,panel:cp.name})}}));
  return out;
}

function instOpts(selInst,selMod){
  const st=S.setup,am=st.amods||{};
  return (st.analysers||[]).map(n=>{const ms=am[n]||[];
    if(!ms.length)return `<option value="${esc(n)}|"${n===selInst?' selected':''}>${esc(n)}</option>`;
    return `<optgroup label="${esc(n)}"><option value="${esc(n)}|"${n===selInst&&!selMod?' selected':''}>${esc(n)} (any module)</option>${ms.map(m=>`<option value="${esc(n)}|${esc(m)}"${n===selInst&&selMod===m?' selected':''}>${esc(n)} · ${esc(m)}</option>`).join('')}</optgroup>`}).join('');
}
const splitInst=v=>{const k=v.lastIndexOf('|');return {inst:v.slice(0,k),mod:v.slice(k+1)}};
function defMod(name,inst){
  const ms=(S.setup.amods||{})[inst]||[];if(!ms.length)return '';
  const imm=S.setup.dept==='Immunochemistry',ise=/^(sodium|potassium|chloride)$/i.test(name);
  return (imm?ms.find(x=>/^e\b/i.test(x)):ise?ms.find(x=>/ISE|electrolyte/i.test(x)):(ms.find(x=>/^c\b/i.test(x))||ms.find(x=>/photometric/i.test(x))))||'';
}
function byAnalyser(list,fn){

function setLevels(a,n){

  s+=`<rect x="${ml}" y="${Y(ymax)}" width="${pw}" height="${Y(3)-Y(ymax)}" fill="var(--zone3)"/><rect x="${ml}" y="${Y(-3)}" width="${pw}" height="${Y(-ymax)-Y(-3)}" fill="var(--zone3)"/>`;

  });

    s+=`<rect class="${tr?'sp-t':'sp-s'}" x="${x0}" y="${mt}" width="${x1-x0}" height="${ph}" rx="3"/><text class="spl ${tr?'spl-t':'spl-s'}" x="${x0+4}" y="${mt+ph-(tr?6:20)}">${tr?'Trend':'Shift'} ${sp.dir>0?'↑':'↓'} ${sp.n} runs</text>`});

function saveAdd(){
  const m=UI.modal,d=readAdd(),err=document.getElementById('a-err'),n=m.n;

  if(d.mode==='move'){
    if(!d.mv.length)return fail('Tick at least one analyte to move.');
    d.mv.forEach(id=>moveAnalyte(id,m.panel));
    audit('Analytes moved',d.mv.map(id=>(anOf(id)||{}).name).join(', ')+' to '+m.panel);
  UI.modal=null;save();toast(d.mv.length+' analyte'+(d.mv.length>1?'s':'')+' moved to '+m.panel+'.');return;
  }
  let name=d.name.trim();
  if(!name)return fail('Enter the analyte name.');
  if(DA().some(a=>a.name.toLowerCase()===name.toLowerCase()))return fail(name+' already exists. To run it on another analyser use "Copy selected" under Assign analytes to analysers.');
  const levels=[];
  for(let i=0;i<n;i++){
    const mean=num(d.means[i]),sd=num(d.sds[i]),mat=d.mats[i].trim();
    if(!mat)return fail('Every level needs a QC material name ('+levelName(i)+').');
    if(!d.exps[i])return fail('Every level needs an expiry date ('+levelName(i)+').');
    if(mean==null||!(sd>0))return fail('Every level needs a mean and an SD above zero.');
    levels.push({mean,sd,material:mat,lot:d.lots[i].trim(),exp:d.exps[i]});
  }
  const first=DA().find(x=>x.panel===m.panel);let schedule={type:'daily'};
  if(d.sched==='panel'&&first)schedule=JSON.parse(JSON.stringify(first.schedule));
  else if(d.sched==='ondemand')schedule={type:'ondemand'};
  else if(d.sched==='weekdays'){if(!d.days.length)return fail('Choose at least one day.');schedule={type:'weekdays',days:d.days}}
  else if(d.sched==='interval')schedule={type:'interval',every:Math.max(2,+d.every||2),start:d.start||todayStr()};
  const unit=d.unit.trim(),ai=d.inst?splitInst(d.inst):{inst:first?instOf(first):(S.setup.analysers||[])[0]||'',mod:first?(first.mod||''):''};
  name=registerSrc(m.panel,name,unit);
  S.analytes.push({id:uid(),dept:curId(),name,unit,panel:m.panel,inst:ai.inst,mod:ai.mod,nlev:n,schedule,targets:[{from:todayStr(),comment:'Added after setup',levels}]});
  audit('Analyte added',name+' to '+m.panel+' ('+n+' level'+(n>1?'s':'')+')');
  UI.modal=null;save();toast(name+' added to '+m.panel+'.');
}

const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function hashPw(pw,saltB64){
  const salt=saltB64?unb64(saltB64):crypto.getRandomValues(new Uint8Array(16));
  const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:150000},key,256);
  return {salt:b64(salt),hash:b64(bits)};
}
const checkPw=async(pw,rec)=>rec&&(await hashPw(pw,rec.salt)).hash===rec.hash;
function genCode(){
  const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(12));
  const c=[...r].map(x=>A[x%A.length]).join('');return c.slice(0,4)+'-'+c.slice(4,8)+'-'+c.slice(8);
}
function genPw(){
  const A='abcdefghijkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(10));
  return [...r].map(x=>A[x%A.length]).join('');
}

async function doSvcLogin(un,pw){
  const bad='Username or password is incorrect.';
  let salt;try{salt=(await svcCall('/salt',{u:un},false)).salt}catch(e){return UI.authMsg=e.message}
  const hash=(await hashPw(pw,salt)).hash;setCred({u:un,hash,salt});
  let j;try{j=await svcCall('/pull')}catch(e){setCred(null);return UI.authMsg=e.code===401?bad:e.message}
  if(j.empty||!j.data){setCred(null);return UI.authMsg='This laboratory has no data on the sync service yet. The administrator needs to connect it first.'}
  S=norm(mergeStates(S,norm(j.data)));S.tab='today';
  const u=S.users.find(x=>x.id===j.me);if(!u){setCred(null);return UI.authMsg=bad}
  GHS.sha=j.sha;GHS.lastHash=null;GHS.boot=false;
  signIn(u);audit('Sign in','',u);save();
}
async function doLogin(){
  const un=gv('li-user').trim().toLowerCase(),pw=gv('li-pass');UI.authUser=un;
  if(svcOn())return doSvcLogin(un,pw);
  const u=S.users.find(x=>x.username===un||String(x.email||'').toLowerCase()===un),bad='Username or password is incorrect.';
  if(!u||u.active===false){audit('Failed sign-in','Unknown or disabled username "'+un+'"',{id:null,name:un});save();return UI.authMsg=bad}
  if(u.lockUntil&&Date.now()<u.lockUntil)return UI.authMsg='Too many attempts. Wait a minute and try again.';
  if(!await checkPw(pw,u.pw)){u.fails=(u.fails||0)+1;if(u.fails>=5){u.lockUntil=Date.now()+60000;u.fails=0}audit('Failed sign-in','Wrong password',u);save();return UI.authMsg=bad}
  u.fails=0;u.lockUntil=0;signIn(u);audit('Sign in','',u);save();
}

async function doUserEdit(){

/* ===== Establish limits: mean and SD from 20 to 60 runs ===== */
const EST_MIN=20,EST_MAX=60;
const estOf=id=>(S.est||(S.est=[])).find(s=>s.id===id);
function estStats(vals){
  const n=vals.length;if(!n)return {n:0,mean:0,sd:0,cv:0,min:0,max:0};
  const mean=vals.reduce((a,b)=>a+b,0)/n;
  const sd=n>1?Math.sqrt(vals.reduce((a,b)=>a+(b-mean)*(b-mean),0)/(n-1)):0;
  return {n,mean,sd,cv:mean?sd/Math.abs(mean)*100:0,min:Math.min(...vals),max:Math.max(...vals)};
}
function estLevel(s,lv){
  const rows=s.runs.map(r=>({r,v:r.v[lv],ex:!!(r.ex&&r.ex[lv])})).filter(x=>x.v!=null);
  const inc=rows.filter(x=>!x.ex).map(x=>x.v),st=estStats(inc);
  const out=(st.n>=8&&st.sd>0)?rows.filter(x=>!x.ex&&Math.abs(x.v-st.mean)>3*st.sd).map(x=>x.r.id):[];
  return {rows,inc,st,out,ready:st.n>=EST_MIN};
}
const estDec=sd=>Math.min(4,Math.max(0,2-Math.floor(Math.log10(sd>0?sd:1))));
const rnd=(v,d)=>{const f=Math.pow(10,d);return Math.round(v*f)/f};
function estChart(info,dp){
  const W=460,H=215,ml=48,mr=64,mt=12,mb=26,pw=W-ml-mr,ph=H-mt-mb,st=info.st,rows=info.rows;
  if(rows.length<2||!(st.sd>0))return '<div class="muted small" style="padding:24px 0;text-align:center">Add at least two values to see the chart.</div>';
  const zs=rows.map(x=>(x.v-st.mean)/st.sd),ymax=Math.max(3.5,Math.ceil((Math.max(...zs.map(Math.abs))+.3)*2)/2);
  const Y=z=>mt+(ymax-z)/(2*ymax)*ph,step=pw/rows.length,X=i=>ml+(i+.5)*step;
  let s=`<svg class="lj" viewBox="0 0 ${W} ${H}" role="img" aria-label="Values collected so far with the calculated limits">`;
  s+=`<rect x="${ml}" y="${Y(1)}" width="${pw}" height="${Y(-1)-Y(1)}" fill="var(--zone1)"/><rect x="${ml}" y="${Y(3)}" width="${pw}" height="${Y(2)-Y(3)}" fill="var(--zone2)"/><rect x="${ml}" y="${Y(-2)}" width="${pw}" height="${Y(-3)-Y(-2)}" fill="var(--zone2)"/>`;
  for(let k=-3;k<=3;k++){
    const cls=k===0?'mean':Math.abs(k)===3?'s3':Math.abs(k)===2?'s2':'s1',lc=k===0?'lm':Math.abs(k)===3?'l3':Math.abs(k)===2?'l2':'';
    s+=`<line class="${cls}" x1="${ml}" x2="${ml+pw}" y1="${Y(k)}" y2="${Y(k)}"/><text class="${lc}" x="${ml-6}" y="${Y(k)+4}" text-anchor="end">${k===0?'Mean':(k>0?'+':'−')+Math.abs(k)+' SD'}</text><text class="${lc}" x="${ml+pw+6}" y="${Y(k)+4}">${fmt(st.mean+k*st.sd,dp)}</text>`;
  }
  s+=`<polyline class="line" points="${rows.map((x,i)=>X(i)+','+Y(Math.max(-ymax,Math.min(ymax,zs[i])))).join(' ')}"/>`;
  rows.forEach((x,i)=>{const o=info.out.includes(x.r.id),c=x.ex?'pt ex':o?'pt r':'pt';
    s+=`<circle class="${c}" cx="${X(i)}" cy="${Y(Math.max(-ymax,Math.min(ymax,zs[i])))}" r="${o?6:4}"/>`});
  s+=`<text x="${X(0)}" y="${H-8}" text-anchor="middle">${shortDate(rows[0].r.date)}</text><text x="${X(rows.length-1)}" y="${H-8}" text-anchor="middle">${shortDate(rows[rows.length-1].r.date)}</text></svg>`;

/* ----- actions ----- */
function estAct(act,el){
  const id=el.dataset.id,s=el.dataset.sid?estOf(el.dataset.sid):estOf(id);
  const done=()=>{save();render();return true};
  switch(act){
   case 'eststart':{const a=anOf(UI.estAid),t=curTarget(a);
     const mats=t.levels.slice(0,a.nlev).map((_,i)=>gv('est-m-'+i).trim()),lots=t.levels.slice(0,a.nlev).map((_,i)=>gv('est-l-'+i).trim()),exps=t.levels.slice(0,a.nlev).map((_,i)=>gv('est-x-'+i));
     const n=estNew(a,mats,lots,exps);S.est.push(n);UI.estSid=n.id;UI.estNote=null;UI.estDp=null;audit('Limits data set started',a.name+' ('+n.levels.map(l=>l.material+(l.lot?' lot '+l.lot:'')).join('; ')+')');return done()}
   case 'estnew':UI.estSid=null;UI.estNote=null;return done();
   case 'estopen':UI.estSid=id;UI.estNote=null;UI.estDp=null;return done();
   case 'estadd':{const sx=estOf(UI.estSid);if(!sx||sx.status!=='collecting')return true;
     if(sx.runs.length>=EST_MAX){toast('A data set holds up to '+EST_MAX+' runs.');return true}
     const v=sx.levels.map((_,i)=>num(gv('est-in-'+i))),date=gv('est-date-new')||todayStr();
     if(v.every(x=>x==null)){toast('Enter at least one value.');return true}
     const r={id:uid(),date,v,ex:v.map(()=>false),...stampNow()};sx.runs.push(r);UI.estNewDate=date;
     audit('Limits data added',(anOf(sx.aid)||{}).name+' '+fmtDate(date)+': '+v.map((x,i)=>x==null?null:levelName(i)+'='+x).filter(Boolean).join(', '));
     save();render();const f=document.getElementById('est-in-0');if(f)f.focus();return true}
   case 'estimp':{const sx=estOf(UI.estSid);if(!sx)return true;const from=gv('est-impfrom')||todayStr();UI.estImp=from;
     const byDate={};S.results.filter(r=>r.aid===sx.aid&&r.date>=from&&r.lv<sx.levels.length).forEach(r=>{(byDate[r.date]||(byDate[r.date]=Array(sx.levels.length).fill(null)))[r.lv]=r.value});
     const have=new Set(sx.runs.filter(r=>r.src==='qc').map(r=>r.date));let added=0;
     Object.keys(byDate).sort().forEach(d=>{if(have.has(d)||sx.runs.length>=EST_MAX)return;sx.runs.push({id:uid(),date:d,v:byDate[d],ex:byDate[d].map(()=>false),src:'qc',...stampNow()});added++});
     if(!added){toast('No new QC results found from that date.');return true}
     audit('Limits data imported',(anOf(sx.aid)||{}).name+': '+added+' run'+(added>1?'s':'')+' from QC results since '+fmtDate(from));toast(added+' run'+(added>1?'s':'')+' imported.');return done()}
   case 'estrm':{const sx=estOf(el.dataset.sid);if(!sx)return true;const r=sx.runs.find(x=>x.id===id);sx.runs=sx.runs.filter(x=>x.id!==id);
     if(r)audit('Limits run removed',(anOf(sx.aid)||{}).name+' '+fmtDate(r.date));return done()}
   case 'estexo':{const sx=estOf(el.dataset.sid),lv=+el.dataset.lv,info=estLevel(sx,lv);
     if(info.st.n-info.out.length<EST_MIN){toast('Excluding these would leave fewer than '+EST_MIN+' values. Add more runs first, then exclude them.');return true}
     sx.runs.forEach(r=>{if(info.out.includes(r.id)){r.ex=r.ex||[];r.ex[lv]=true}});
     audit('Limits values excluded',(anOf(sx.aid)||{}).name+' '+levelName(lv)+': '+info.out.length+' value'+(info.out.length>1?'s':'')+' beyond 3 SD');return done()}
   case 'estdelask':UI.estDel=id;return done();
   case 'estdelno':UI.estDel=null;return done();
   case 'estdel':{const sx=estOf(id);if(sx)audit('Limits data set deleted',(anOf(sx.aid)||{}).name+' with '+sx.runs.length+' runs'+(sx.status==='applied'?' (had been applied)':''));tomb(id);S.est=S.est.filter(x=>x.id!==id);UI.estDel=null;UI.estSid=null;return done()}
   case 'estexp':estExport(estOf(id));return true;
   case 'estapply':{const sx=estOf(UI.estSid);if(!sx||sx.status!=='collecting')return true;
     const a=anOf(sx.aid),infos=sx.levels.map((_,i)=>estLevel(sx,i)),err=document.getElementById('est-err'),fail=t=>{err.textContent=t;err.hidden=false;return true};
     if(!infos.every(x=>x.ready))return fail('Every level needs at least '+EST_MIN+' values.');
     const dp=+gv('est-dp'),date=gv('est-date')||todayStr(),note=gv('est-note').trim();

     if(sx.levels.some(l=>!l.exp))return fail('Every level needs an expiry date. Enter it in the QC material section above.');
     const levels=infos.map((x,i)=>({mean:rnd(x.st.mean,dp),sd:rnd(x.st.sd,dp),material:sx.levels[i].material.trim(),lot:(sx.levels[i].lot||'').trim(),exp:sx.levels[i].exp}));
     if(levels.some(l=>!(l.sd>0)))return fail('An SD rounds to zero. Increase the decimal places.');
     const t={from:date,type:'Established from in-house data',comment:note,at:nowIso(),by:CU?CU.id:null,byName:CU?CU.name:'',est:sx.id,levels};
     a.targets=a.targets.filter(x=>x.from!==date);a.targets.push(t);a.targets.sort((x,y)=>x.from<y.from?-1:1);
     sx.status='applied';sx.applied={at:t.at,by:t.by,byName:t.byName,from:date,mean:levels.map(l=>l.mean),sd:levels.map(l=>l.sd)};
     audit('Limits applied',a.name+' from '+fmtDate(date)+': '+levels.map((l,i)=>levelName(i)+' mean '+l.mean+' SD '+l.sd).join('; '));
     UI.estNote=null;UI.estDate=null;toast('New mean and SD inserted into '+a.name+'.');return done()}
  }
  return false;
}
function estChange(e){

  if(d.estdp!==undefined){UI.estDp=+t.value;render();return true}

  if(t.id==='est-date'){UI.estDate=t.value;return true}
  if(t.id==='est-date-new'){UI.estNewDate=t.value;return true}
  if(t.id==='est-impfrom'){UI.estImp=t.value;return true}
  if(t.id==='est-matlib'||t.id==='est-matlib2'){const ml=matList().find(x=>x.id===t.value);
    if(ml){if(t.id==='est-matlib'){const a=anOf(UI.estAid),k=Math.min(a?a.nlev:0,ml.levels.length),set=(i,v)=>{const x=document.getElementById(i);if(x)x.value=v};

/* ===== Sigma metrics and measurement uncertainty ===== */
const SG_MINN=20;
const SGCLS=[
 {min:6,key:'wc',name:'World class',col:'#0b7a6f',adv:'Very robust. A simple 1-3s rule with 2 controls per run is enough, with the fewest false rejections.'},
 {min:5,key:'ex',name:'Excellent',col:'#3f9d52',adv:'Robust. 1-3s, 2-2s and R-4s with 2 controls per run (N=2) is suitable.'},
 {min:4,key:'gd',name:'Good',col:'#8aa81f',adv:'Acceptable. Use 1-3s, 2-2s, R-4s and 4-1s with 4 controls per run (N=4), or 2 controls twice a day.'},
 {min:3,key:'mg',name:'Marginal',col:'#d9962a',adv:'Marginal. Use the full multirule with as many controls as practical (N=4 to 6), watch closely and work on reducing bias and imprecision.'},
 {min:-1e9,key:'po',name:'Poor',col:'#c0392b',adv:'Not acceptable. QC cannot make up for this. Investigate and reduce bias and imprecision, or review the allowable error goal, before relying on this method.'}];
const sgClass=s=>s==null||!isFinite(s)?null:SGCLS.find(c=>s>=c.min);
const sgSet=a=>Object.assign({tea:'',mode:'pct',abs:'',src:'',clia:'',bias:'',bsrc:'entered',ub:'',k:2},a.sigma||{});
const sgTeaTxt=(set,u)=>set.tea===''||set.tea==null?'not set':set.mode==='abs'?set.tea+' '+(u||'units'):set.mode==='both'?set.tea+' % or '+(set.abs===''?'?':set.abs)+' '+(u||'units')+' (whichever is greater)':set.tea+' %';
const sgState=()=>UI.sg||(UI.sg={dept:'',panel:'',sort:'high',win:'era',excl:false,open:{},draft:{}});
const SGWIN={era:'Since the current target started',90:'Last 90 days',180:'Last 180 days',365:'Last 365 days'};
const sgf=(v,d)=>v==null||!isFinite(v)?'–':(+v).toFixed(d==null?2:d);

function sgCalc(a,win,excl){
  const set=sgSet(a),tea=num(set.tea),ub=num(set.ub)||0,k=num(set.k)||2,bias0=num(set.bias),today=todayStr();
  const cut=!win||win==='era'?'':dstr(new Date(Date.now()-(+win)*864e5)),T=curTarget(a),levels=[];
  for(let lv=0;lv<a.nlev;lv++){
    const t=T.levels[lv];if(!t)continue;
    const era=lvEra(a,lv,today);
    let rs=S.results.filter(r=>r.aid===a.id&&r.lv===lv&&r.value!=null&&isFinite(r.value)&&lvEra(a,lv,r.date)===era&&(!cut||r.date>=cut));
    if(excl&&t.sd>0)rs=rs.filter(r=>Math.abs((r.value-t.mean)/t.sd)<=3);
    const n=rs.length;let mo=null,so=null;
    if(n){mo=rs.reduce((s,r)=>s+r.value,0)/n;so=n>1?Math.sqrt(rs.reduce((s,r)=>s+(r.value-mo)*(r.value-mo),0)/(n-1)):null}
    const cvT=t.mean?Math.abs(t.sd/t.mean)*100:null,cvO=mo&&so!=null?Math.abs(so/mo)*100:null;
    const useObs=n>=SG_MINN&&cvO!=null,cv=useObs?cvO:cvT;
    let bias=null,biasNote='';
    if(set.bsrc==='qc'){if(n>=SG_MINN&&t.mean)bias=(mo-t.mean)/t.mean*100;else biasNote='needs '+SG_MINN+' QC values'}
    else bias=bias0;
    const bu=bias==null?0:bias;
    const absV=num(set.abs),teaPct=tea==null?null:set.mode==='abs'?(t.mean?tea/Math.abs(t.mean)*100:null):set.mode==='both'?(t.mean&&absV!=null?Math.max(tea,absV/Math.abs(t.mean)*100):tea):tea;
    const sigma=teaPct!=null&&cv>0?(teaPct-Math.abs(bu))/cv:null;
    const te=cv==null?null:Math.abs(bu)+2*cv,used=teaPct>0&&te!=null?te/teaPct*100:null;
    const Upct=cv==null?null:k*Math.sqrt(cv*cv+ub*ub),Uabs=t.mean&&Upct!=null?Upct/100*Math.abs(t.mean):null;
    levels.push({lv,t,n,mo,so,cvO,cvT,cv,cvSrc:useObs?'observed':'target',bias,bu,biasNote,teaPct,sigma,cls:sgClass(sigma),te,used,Upct,Uabs,k,ub});
  }
  const sg=levels.map(l=>l.sigma).filter(x=>x!=null),worst=sg.length?Math.min(...sg):null;
  return {a,set,levels,worst,cls:sgClass(worst),tea,k,ub,win:win||'era',excl:!!excl};
}
function sgAll(){
  const s=sgState();

  if(s.panel)list=list.filter(a=>a.panel===s.panel);
  const rows=list.map(a=>sgCalc(a,s.win,s.excl));
  const name=(x,y)=>x.a.name.localeCompare(y.a.name);
  rows.sort(s.sort==='name'?name:(x,y)=>{

}

function sgReport(r){

  const meta=[['Laboratory',S.setup.lab||''],['Department',(d.dept||'')+dsub(d.sub)],['Analyser',instLabel(a)],['Panel',a.panel||''],['Analyte',a.name+(u?' ('+u+')':'')],
    ['Report date',fmtDate(todayStr())],['Prepared by',CU?CU.name+' ('+roleName(CU.role)+')':''],['QC values used',SGWIN[r.win]+(r.excl?'; values beyond 3 SD left out':'')]];

    ['Bias',set.bsrc==='qc'?'From QC data: observed mean against target mean':(set.bias===''?'not entered (treated as 0)':set.bias+' % (entered)')],

  const lv=r.levels.map(l=>({name:levelName(l.lv),mat:(l.t.material||'')+(l.t.lot?' lot '+l.t.lot:''),tmean:l.t.mean,tsd:l.t.sd,n:l.n,omean:l.mo,osd:l.so,cv:l.cv,src:l.cvSrc,bias:l.bias,bu:l.bu,note:l.biasNote,tea:l.teaPct,sigma:l.sigma,cls:l.cls,te:l.te,used:l.used,U:l.Upct,Uabs:l.Uabs}));

  }

    `CV comes from the laboratory's own QC values when a level has ${SG_MINN} or more in the period, and from the target SD and mean otherwise.`,
    'The sigma strategy guidance follows the Westgard sigma-rule approach. It is a guide and does not replace your laboratory procedures.'];

}

function sgSrcFor(a,d,mode,tea){
  const c=cliaFor(a);if(!c||!c.usable||!d.clia||d.clia!==c.key)return '';

}

/* ===== Measurement uncertainty report (no allowable error needed) ===== */
function muReport(r){
  const a=r.a,d=deptOfA(a),set=r.set,u=a.unit||'';
  const meta=[['Laboratory',S.setup.lab||''],['Department',(d.dept||'')+dsub(d.sub)],['Analyser',instLabel(a)],['Panel',a.panel||''],['Analyte',a.name+(u?' ('+u+')':'')],
    ['Report date',fmtDate(todayStr())],['Prepared by',CU?CU.name+' ('+roleName(CU.role)+')':''],['QC values used',SGWIN[r.win]+(r.excl?'; values beyond 3 SD left out':'')]];
  const ub=num(set.ub)||0;
  const settings=[['Imprecision, u(Rw)','The CV of the laboratory\'s own QC values over the period, when a level has '+SG_MINN+' or more. Otherwise the CV from the target SD and mean.'],
    ['Uncertainty of bias, u(bias)',ub+' %'+(ub?'':' (not entered, so the uncertainty reflects imprecision only)')],['Coverage factor, k',sgf(r.k,0)+(r.k===2?' (about 95% confidence)':'')]];
  const levels=r.levels.map(l=>({name:levelName(l.lv),mat:(l.t.material||'')+(l.t.lot?' lot '+l.t.lot:''),tmean:l.t.mean,n:l.n,omean:l.mo,osd:l.so,cv:l.cv,src:l.cvSrc,ub:ub,uc:l.cv==null?null:Math.sqrt(l.cv*l.cv+ub*ub),k:l.k,U:l.Upct,Uabs:l.Uabs,lo:l.Uabs==null?null:l.t.mean-l.Uabs,hi:l.Uabs==null?null:l.t.mean+l.Uabs}));
  const stmts=levels.filter(l=>l.Uabs!=null).map(l=>`${l.name}: at the target mean of ${fmt(l.tmean)}${u?' '+u:''}, the expanded uncertainty is ±${sgf(l.Uabs,3)}${u?' '+u:''} (±${sgf(l.U)} %, k=${sgf(l.k,0)}). A result at this level is expected to lie within ${sgf(l.lo,3)} to ${sgf(l.hi,3)}${u?' '+u:''} of the true value${l.k===2?' with about 95% confidence':''}.`);
  const notes=['Combined standard uncertainty u(c) = sqrt(u(Rw)^2 + u(bias)^2), in %. Expanded uncertainty U = k x u(c). U in units = U % / 100 x the target mean.',
    'u(Rw) is the within-laboratory reproducibility, estimated here by the CV of the laboratory\'s QC values. It reflects the whole measurement procedure over time, including calibration and reagent lot changes in the period.',
    'The uncertainty of bias is the value entered on the Sigma metrics tab. If it is not known, leave it at 0 and state that the figure covers imprecision only.',
    'This is an estimate from QC data and does not replace the laboratory\'s own procedure for evaluating measurement uncertainty.'];
  return {title:'Measurement uncertainty report',meta,settings,levels,stmts,notes,r};
}

function muPdfReport(pdf,rep,first){
  if(!first)pdf.add();

  pdf.rect(0,0,W,64,'#0d3b6e');pdf.text(M,30,'QCLens',{size:11,bold:true,color:'#b4e05a'});pdf.text(M,52,rep.title,{size:16,bold:true,color:'#ffffff'});pdf.y=80;
  const colw=(W-2*M)/2;let y0=pdf.y;

  pdf.y=y0+Math.ceil(rep.meta.length/2)*26+4;
  pdf.h('Basis of the estimate');rep.settings.forEach(([k,v])=>pdf.para(k+': '+v,{size:9,gap:2}));
  pdf.h('Uncertainty by control level');
  pdf.table([{h:'Level',w:44},{h:'Material and lot',w:72},{h:'Target mean',w:46,align:'right'},{h:'n',w:22,align:'right'},{h:'u(Rw) = CV %',w:56,align:'right'},{h:'u(bias) %',w:42,align:'right'},{h:'u(c) %',w:38,align:'right'},{h:'U %',w:38,align:'right'},{h:'U (units)',w:48,align:'right'},{h:'Range at target mean',w:90,align:'right'}],
    rep.levels.map(l=>[l.name,l.mat||'-',f(l.tmean,3),String(l.n),f(l.cv)+' ('+l.src+')',f(l.ub),f(l.uc),{t:f(l.U),bold:true},{t:f(l.Uabs,3),bold:true},l.lo==null?'-':f(l.lo,3)+' to '+f(l.hi,3)]));
  if(rep.stmts.length){pdf.h('Statement of uncertainty');rep.stmts.forEach(x=>pdf.para(x,{size:9,gap:3}))}

function muPdfSummary(pdf,reps){
  const W=pdf.W,M=pdf.M,f=sgf,s=sgState();
  pdf.rect(0,0,W,64,'#0d3b6e');pdf.text(M,30,'QCLens',{size:11,bold:true,color:'#b4e05a'});pdf.text(M,52,'Measurement uncertainty summary',{size:16,bold:true,color:'#ffffff'});pdf.y=80;
  pdf.para((S.setup.lab||'')+(sgLabel?'   Department: '+sgLabel:'')+'   Report date: '+fmtDate(todayStr())+'   Prepared by: '+(CU?CU.name:''),{size:9,color:'#566a73'});
  pdf.para('QC values used for CV: '+SGWIN[s.win]+(s.excl?'; values beyond 3 SD left out':'')+'. U = k x sqrt(CV^2 + u(bias)^2). Levels with fewer than '+SG_MINN+' QC values use the target CV.',{size:8.5,color:'#566a73'});
  const rows=[];reps.forEach(rep=>rep.levels.forEach((l,i)=>{if(l.U!=null)rows.push([i?'':rep.r.a.name+(rep.r.a.unit?' ('+rep.r.a.unit+')':''),l.name,f(l.tmean,3),f(l.cv)+(l.src==='target'?' (target)':''),f(l.ub),{t:f(l.U),bold:true},f(l.k,0),{t:f(l.Uabs,3),bold:true}])}));
  pdf.table([{h:'Analyte',w:130},{h:'Level',w:50},{h:'Target mean',w:62,align:'right'},{h:'CV %',w:62,align:'right'},{h:'u(bias) %',w:50,align:'right'},{h:'U %',w:46,align:'right'},{h:'k',w:24,align:'right'},{h:'U (units)',w:60,align:'right'}],rows);
}

function trashRestore(tid,intoDept){

    const m=fresh(d.material);m.id=uid();S.materials.push(m);
  }else if(t.kind==='dept'){
    const rec=fresh(d.dept),oldId=rec.id,newId=uid();rec.id=newId;S.depts.push(rec);
    d.analytes.forEach(a=>{map[a.id]=uid();a.id=map[a.id];a.dept=newId;fresh(a)});
    d.results.forEach(r=>{r.id=uid();r.aid=map[r.aid]});
    d.skips.forEach(s=>{s.aid=map[s.aid];if(s.id)s.id=uid()});

      if(d.customPanel&&!S.setup.cpanels.some(c=>c.name===d.panel))S.setup.cpanels.push({id:uid(),name:d.panel,items:[]});
      d.analytes.forEach(a=>{

      d.skips.forEach(s=>{s.aid=map[s.aid];if(s.id)s.id=uid()});

  if(t.id==='qcdate'){UI.date=t.value||todayStr();UI.report=[];UI.skipOpen=null;return render()}
  if(t.id==='cid'){UI.cid=t.value;return render()}
  if(t.id==='win'){if(t.value==='r'){UI.win='r';if(!UI.cfrom&&!UI.cto){UI.cto=todayStr();UI.cfrom=dstr(new Date(Date.now()-29*864e5))}}else UI.win=+t.value;return render()}
  if(t.id==='cfrom'||t.id==='cto'){UI[t.id]=t.value||'';if(UI.cfrom&&UI.cto&&UI.cfrom>UI.cto){const x=UI.cfrom;UI.cfrom=UI.cto;UI.cto=x}return render()}
  if(t.id==='restore'&&t.files[0]){const fr=new FileReader();fr.onload=()=>{try{restoreData(JSON.parse(fr.result),'a backup file')}catch(x){toast('That file is not a valid QC backup.')}};fr.readAsText(t.files[0])}
});
document.addEventListener('toggle',e=>{if(e.target.hasAttribute&&e.target.hasAttribute('data-more'))UI.moreOpen=e.target.open;if(e.target.hasAttribute&&e.target.hasAttribute('data-thopen')){const id=e.target.getAttribute('data-thopen');if(e.target.open)UI.thOpen=id;else if(UI.thOpen===id)UI.thOpen=null}},true);
/* chart tooltips */
document.addEventListener('pointerover',e=>{
  const h=e.target.closest&&e.target.closest('.hit');if(!h)return;
  const box=h.closest('.chartbox');let tip=box.querySelector('.tip');
  if(!tip){tip=document.createElement('div');tip.className='tip';box.appendChild(tip)}
  tip.innerHTML=h.dataset.tip;tip.hidden=false;
  const b=box.getBoundingClientRect(),c=h.getBoundingClientRect();
  tip.style.left=Math.min(Math.max(0,c.left-b.left+c.width/2-60),Math.max(0,b.width-190))+'px';
  tip.style.top=(c.top-b.top-tip.offsetHeight-8)+'px';
});
document.addEventListener('pointerout',e=>{const h=e.target.closest&&e.target.closest('.hit');if(h){const t=h.closest('.chartbox').querySelector('.tip');if(t)t.hidden=true}});
if(ghOn()&&(!GH.svc||CRED)){UI.cfgWait=true;render();ghSync().catch(()=>{}).finally(()=>{UI.cfgWait=false;restoreSess();render()})}else{restoreSess();render()}

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches&&e.target.matches('[data-amodnew]')){e.preventDefault();e.target.dispatchEvent(new Event('change',{bubbles:true}))}});
ghBoot();
</script>

</body></html>
